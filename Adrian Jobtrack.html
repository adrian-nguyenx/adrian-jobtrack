<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adrian Jobtrack</title>
<meta name="description" content="Adrian Jobtrack — track, manage and analyse your job applications.">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Jobtrack">
<meta name="theme-color" content="#1e3a6d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e3a6d'/%3E%3Cg fill='none' stroke='white' stroke-width='3' stroke-linecap='round'%3E%3Ccircle cx='14' cy='14' r='7.5'/%3E%3Cpath d='M19.6 19.6 25.5 25.5'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* =========================================================
   Design tokens (light default, dark via data-theme / system)
   ========================================================= */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f7;
  --border:#e1e7ef; --border-strong:#cdd6e2;
  --text:#0f1c2e; --text-2:#3b4a5e; --muted:#6b7a90;
  --primary:#1e3a6d; --primary-hover:#17305b; --primary-soft:#e6edf8; --primary-text:#ffffff; --link:#2456a6;
  --accent:#b8902a;
  --danger:#c0362c; --danger-soft:#fdecea; --warn:#a86300; --warn-soft:#fff3dd; --ok:#1d7a46; --ok-soft:#e5f5ec; --info-soft:#e8f0fd;
  --shadow:0 1px 2px rgba(15,28,46,.05),0 2px 8px rgba(15,28,46,.05);
  --shadow-hover:0 4px 16px rgba(15,28,46,.12);
  --shadow-lg:0 16px 48px rgba(15,28,46,.22);
  --radius:10px;
  --s-applied:#2563eb; --s-applied-bg:#e7efff;
  --s-interview:#7c3aed; --s-interview-bg:#f1eafe;
  --s-offer:#0f8f84; --s-offer-bg:#e0f5f2;
  --s-hired:#15803d; --s-hired-bg:#e3f5e9;
  --s-rejected:#c62828; --s-rejected-bg:#fdeaea;
  --s-declined:#c2610c; --s-declined-bg:#fff0e3;
  --s-noresponse:#64748b; --s-noresponse-bg:#eef1f5;
  --heat-0:#eaeef4; --heat-1:#c9d9f2; --heat-2:#8fb1e6; --heat-3:#4f7fcf; --heat-4:#1e3a6d;
  --overlay:rgba(8,15,28,.55);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#121b2c; --surface-2:#162133; --surface-3:#1d2a40;
    --border:#243149; --border-strong:#33445f;
    --text:#e7edf6; --text-2:#c3cede; --muted:#8c9cb2;
    --primary:#5b8def; --primary-hover:#79a2f3; --primary-soft:#1b2a45; --primary-text:#0b1220; --link:#8db2ff;
    --accent:#d9b44a;
    --danger:#f07167; --danger-soft:#3a1d20; --warn:#f0a840; --warn-soft:#3a2c15; --ok:#4cc38a; --ok-soft:#163327; --info-soft:#1a2740;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 4px 16px rgba(0,0,0,.45); --shadow-lg:0 16px 48px rgba(0,0,0,.6);
    --s-applied:#6b9bff; --s-applied-bg:#1a2a4d;
    --s-interview:#a78bfa; --s-interview-bg:#2a2148;
    --s-offer:#2dd4bf; --s-offer-bg:#11332f;
    --s-hired:#4ade80; --s-hired-bg:#133322;
    --s-rejected:#f87171; --s-rejected-bg:#3b1a1c;
    --s-declined:#fb923c; --s-declined-bg:#3a2414;
    --s-noresponse:#9aa8bb; --s-noresponse-bg:#232d3d;
    --heat-0:#1a2436; --heat-1:#1f3a66; --heat-2:#2c5aa0; --heat-3:#4f84e0; --heat-4:#8db2ff;
    --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2c; --surface-2:#162133; --surface-3:#1d2a40;
  --border:#243149; --border-strong:#33445f;
  --text:#e7edf6; --text-2:#c3cede; --muted:#8c9cb2;
  --primary:#5b8def; --primary-hover:#79a2f3; --primary-soft:#1b2a45; --primary-text:#0b1220; --link:#8db2ff;
  --accent:#d9b44a;
  --danger:#f07167; --danger-soft:#3a1d20; --warn:#f0a840; --warn-soft:#3a2c15; --ok:#4cc38a; --ok-soft:#163327; --info-soft:#1a2740;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hover:0 4px 16px rgba(0,0,0,.45); --shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --s-applied:#6b9bff; --s-applied-bg:#1a2a4d;
  --s-interview:#a78bfa; --s-interview-bg:#2a2148;
  --s-offer:#2dd4bf; --s-offer-bg:#11332f;
  --s-hired:#4ade80; --s-hired-bg:#133322;
  --s-rejected:#f87171; --s-rejected-bg:#3b1a1c;
  --s-declined:#fb923c; --s-declined-bg:#3a2414;
  --s-noresponse:#9aa8bb; --s-noresponse-bg:#232d3d;
  --heat-0:#1a2436; --heat-1:#1f3a66; --heat-2:#2c5aa0; --heat-3:#4f84e0; --heat-4:#8db2ff;
  --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}

/* ================= Base ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
body.no-scroll{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.25;color:var(--text)}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;font-weight:650}
h3{font-size:13px;font-weight:650}
p{margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ================= App bar ================= */
.appbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border)}
.appbar-inner{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1e3a6d,#2f5fae);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;border-bottom:3px solid #c9a227;flex-shrink:0}
.brand-name{font-weight:750;font-size:15px;white-space:nowrap}
.brand-sub{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--text-2);font-weight:550;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tab-count{font-size:11px;background:var(--primary-soft);color:var(--primary);padding:0 7px;border-radius:999px;font-weight:650}
.appbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-status.saving .dot{background:var(--warn);animation:pulse 1s infinite}
.save-status.failed,.save-status.unavailable{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.save-status.failed .dot,.save-status.unavailable .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.25}}

/* ================= Buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:550;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger);filter:brightness(.93)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-3)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;color:var(--text-2);flex-shrink:0}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.sm{width:26px;height:26px;border-radius:6px}
.icon-btn.danger:hover{color:var(--danger);background:var(--danger-soft)}
.link-btn{border:0;background:none;padding:0;color:var(--link);cursor:pointer;font-weight:550;font-size:12.5px}
.link-btn:hover{text-decoration:underline}

/* ================= Menu ================= */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:230px;z-index:60}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--surface-3)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.menu .menu-note{font-size:11px;color:var(--muted);padding:4px 10px 2px}
.sync-slot{display:inline-flex}
.sync-slot:empty{display:none}
body .cs-root{--cs-surface:var(--surface);--cs-surface2:var(--surface-2);--cs-border:var(--border);--cs-text:var(--text);--cs-muted:var(--muted);--cs-accent:var(--primary);--cs-ink:#fff;--cs-danger:var(--danger)}
.sync-slot .cs-pill{padding:5px 10px;border-radius:999px;font-size:12px}
@media (max-width:640px){ .sync-slot .cs-pill .cs-label{display:none} .sync-slot .cs-pill{padding:0;width:34px;height:34px;justify-content:center} }

/* ================= Layout ================= */
.container{max-width:1440px;width:100%;margin:0 auto;padding:20px;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head p{margin-top:2px;font-size:13px;color:var(--muted)}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:16px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-head .sub{font-size:12px;color:var(--muted)}
.banner{max-width:1400px;margin:12px auto 0;padding:10px 14px;border-radius:8px;font-size:13px;width:calc(100% - 32px)}
.banner.error{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.app-footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 20px 24px}

/* ================= Status colours ================= */
.st-applied{--c:var(--s-applied);--cb:var(--s-applied-bg)}
.st-interview{--c:var(--s-interview);--cb:var(--s-interview-bg)}
.st-offer{--c:var(--s-offer);--cb:var(--s-offer-bg)}
.st-hired{--c:var(--s-hired);--cb:var(--s-hired-bg)}
.st-rejected{--c:var(--s-rejected);--cb:var(--s-rejected-bg)}
.st-declined{--c:var(--s-declined);--cb:var(--s-declined-bg)}
.st-noresponse{--c:var(--s-noresponse);--cb:var(--s-noresponse-bg)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--cb,var(--surface-3));color:var(--c,var(--text-2));white-space:nowrap}
.dot-c{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:650;white-space:nowrap}
.tag-overdue{background:var(--danger-soft);color:var(--danger)}
.tag-urgent{background:var(--warn-soft);color:var(--warn)}
.tag-upcoming{background:var(--info-soft);color:var(--link)}
.tag-ontrack{background:var(--surface-3);color:var(--muted)}
.tag-follow{background:var(--warn-soft);color:var(--warn)}
.tag-follow.hot{background:var(--danger-soft);color:var(--danger)}
.tag-neutral{background:var(--surface-3);color:var(--text-2)}
.prio-high{background:var(--danger-soft);color:var(--danger)}
.prio-medium{background:var(--warn-soft);color:var(--warn)}
.prio-low{background:var(--surface-3);color:var(--muted)}
.prio-wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.prio-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prio-tile{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);border-top:3px solid var(--pc);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.prio-tile:hover{border-color:var(--pc)}
.prio-tile .p-name{font-size:12px;font-weight:650;color:var(--pc)}
.prio-tile .p-val{font-size:24px;font-weight:750;line-height:1.15}
.prio-tile .p-sub{font-size:11.5px;color:var(--muted)}
.prio-tile.high{--pc:var(--danger)}.prio-tile.medium{--pc:var(--warn)}.prio-tile.low{--pc:var(--muted)}
.prio-mix{margin-top:12px}
.prio-mix-row{display:grid;grid-template-columns:62px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12px;padding:3px 0}
.prio-mix-row .bar-track{height:8px}
.prio-seg{display:flex;height:100%;border-radius:999px;overflow:hidden}
.prio-seg i{display:block;height:100%}
@media (max-width:900px){ .prio-wrap{grid-template-columns:minmax(0,1fr)} }

/* ================= Dashboard ================= */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:16px 16px 14px 18px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--primary))}
button.card,button.status-card{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.kpi:hover{box-shadow:var(--shadow-hover)}
.kpi>span,.status-card>span{display:block}
.status-card>.s-name{display:flex}
.li[role="button"]{cursor:pointer}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.alert .val{color:var(--warn)}
.status-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:16px}
.status-card{padding:12px 14px;cursor:pointer;text-align:left;border-top:3px solid var(--c);background:var(--surface);border-left:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:box-shadow .15s}
.status-card:hover{box-shadow:var(--shadow-hover)}
.status-card .s-name{font-size:12px;font-weight:650;color:var(--c);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status-card .s-val{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.status-card .s-pct{font-size:12px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:118px 1fr 96px;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:3px 4px;text-align:left;width:100%;border-radius:6px}
.bar-row:hover{background:var(--surface-2)}
.bar-label{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar-track{height:14px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--c,var(--primary));border-radius:999px;transition:width .4s}
.bar-val{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.bar-val b{color:var(--text)}

.rate-group+.rate-group{margin-top:14px}
.rate-group h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between}
.rate{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 0;border-top:1px solid var(--border)}
.rate:first-of-type{border-top:0}
.rate .r-name{font-weight:600;font-size:13px}
.rate .r-val{font-weight:700;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.rate .r-sub{font-size:11.5px;color:var(--muted);grid-column:1/-1}
.rate .r-na{font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.footnote{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.45}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-top:1px solid var(--border);cursor:pointer;border-radius:6px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li-main{flex:1;min-width:0}
.li-title{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-sub{font-size:12px;color:var(--muted)}
.li-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;font-size:12px}
.timeline .li{position:relative;padding-left:22px}
.timeline .li::before{content:"";position:absolute;left:7px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--cb)}
.subhead{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;margin:12px 0 4px}

.insight{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);margin-bottom:8px;align-items:flex-start}
.insight .sev{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.sev-high{background:var(--danger)} .sev-med{background:var(--warn)} .sev-low{background:var(--link)}
.insight .i-main{flex:1;min-width:0}
.insight .i-title{font-weight:600;font-size:13px}
.insight .i-detail{font-size:12px;color:var(--text-2)}
.insight .i-rule{font-size:11px;color:var(--muted);margin-top:2px}
.insight .i-act{flex-shrink:0}
.legend-row{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend-row span{display:inline-flex;align-items:center;gap:5px}
.legend-row i{width:8px;height:8px;border-radius:50%;display:inline-block}

.dl-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}

.sal-group{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.sal-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:8px;flex-wrap:wrap}
.sal-head b{font-size:13px}
.sal-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.sal-stat .l{font-size:11px;color:var(--muted)}
.sal-stat .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.sal-top{font-size:12px;display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed var(--border);cursor:pointer}
.sal-top:hover span:first-child{color:var(--link)}
.sal-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sal-top span:last-child{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}

.heat-wrap{display:flex;gap:6px}
.heat-days{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:4px;font-size:10px;color:var(--muted);width:24px}
.heat-days span{display:flex;align-items:center}
.heat{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,34px);gap:4px;flex:1}
.heat-cell{aspect-ratio:1;border-radius:4px;border:0;padding:0;background:var(--heat-0);cursor:pointer;min-width:0}
.heat-cell[data-l="1"]{background:var(--heat-1)}
.heat-cell[data-l="2"]{background:var(--heat-2)}
.heat-cell[data-l="3"]{background:var(--heat-3)}
.heat-cell[data-l="4"]{background:var(--heat-4)}
.heat-cell.future{background:transparent;border:1px dashed var(--border);cursor:default}
.heat-cell.today{outline:2px solid var(--accent);outline-offset:1px}
.heat-cell.sel{outline:2px solid var(--text);outline-offset:1px}
.heat-weeks{display:grid;grid-template-columns:repeat(7,minmax(0,34px));gap:4px;font-size:10px;color:var(--muted);margin:5px 0 0 30px}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end;margin-top:10px}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.heat-detail{margin-top:10px;font-size:12px;border-top:1px solid var(--border);padding-top:8px}
.heat-detail .hd-item{display:flex;gap:8px;padding:3px 0}
.heat-detail .hd-time{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}

/* ================= Toolbar / filters ================= */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;margin-bottom:14px}
.search{position:relative;flex:1 1 260px;min-width:200px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:32px;width:100%}
.input{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13px;min-height:34px}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.toolbar select.input,.toolbar input[type=date].input{width:auto}
textarea.input{resize:vertical;min-height:64px;line-height:1.45}
textarea.jd-text{min-height:240px;font-size:13.5px;line-height:1.55}
.cv-pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cv-pick select{flex:1 1 240px;min-width:0}
.cv-pick .btn{flex-shrink:0;text-decoration:none}
.cv-status{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;line-height:1.5}
.cv-status svg{flex-shrink:0}
.cv-actions{display:flex;gap:8px;flex-wrap:wrap}
.cv-row{display:flex;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--border)}
.cv-row .cv-ico{color:var(--muted);display:flex}
.cv-row .btn{text-decoration:none;flex-shrink:0}
.cv-row .li-title{white-space:normal;word-break:break-word}
.sortbox{display:flex;gap:4px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%;align-items:center}
.chip-label{font-size:12px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text-2)}
.chip:hover{border-color:var(--c)}
.chip.on{background:var(--cb);border-color:var(--c);color:var(--c)}
.chip .n{font-weight:500;opacity:.8}
.seg{display:inline-flex;background:var(--surface-3);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.result-line{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}

/* ================= Kanban ================= */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(258px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border:1px solid var(--border);border-top:3px solid var(--c);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 250px);min-height:220px;scroll-snap-align:start;transition:background .15s}
.col.drag-over{background:var(--cb);border-color:var(--c)}
.col-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;font-weight:650;font-size:13px}
.col-count{margin-left:auto;font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 8px;font-weight:650;font-variant-numeric:tabular-nums}
.col-count .muted{font-weight:500}
.col-body{flex:1;overflow-y:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.col-empty{font-size:12px;color:var(--muted);text-align:center;padding:18px 8px;border:1px dashed var(--border-strong);border-radius:8px}
.col-add{margin:0 8px 8px;border:1px dashed var(--border-strong);background:transparent;border-radius:8px;padding:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.col-add:hover{color:var(--c);border-color:var(--c);background:var(--surface)}
.job-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:8px;padding:10px 10px 10px 11px;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:box-shadow .15s}
.job-card:hover{box-shadow:var(--shadow-hover)}
.job-card.dragging{opacity:.4}
.job-card.alert-overdue{border-top-color:var(--danger);border-right-color:var(--danger);border-bottom-color:var(--danger);background:linear-gradient(0deg,var(--danger-soft),var(--surface) 60%)}
.job-card.alert-urgent{border-top-color:var(--warn);border-right-color:var(--warn);border-bottom-color:var(--warn)}
.jc-top{display:flex;align-items:flex-start;gap:6px}
.jc-company{font-weight:650;font-size:13px;flex:1;min-width:0;overflow-wrap:anywhere}
.jc-title{font-size:12.5px;color:var(--text-2);margin-top:1px;overflow-wrap:anywhere}
.jc-cat{font-size:11px;color:var(--muted);margin-top:2px}
.jc-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11.5px;color:var(--muted);align-items:center}
.jc-meta .m{display:inline-flex;align-items:center;gap:4px}
.jc-meta .m.warn{color:var(--warn);font-weight:600}
.jc-meta .jc-link{color:var(--link);text-decoration:none;font-weight:600}
.jc-meta .jc-link:hover{text-decoration:underline}
.jc-foot{margin-top:7px;font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hover-actions{display:flex;gap:2px;align-items:center;opacity:0;transition:opacity .15s;position:absolute;top:6px;right:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:2px;z-index:2}
.job-card:hover .hover-actions,.job-card:focus-within .hover-actions,.note-card:hover .hover-actions,.note-card:focus-within .hover-actions{opacity:1}
.mini-select{font-size:11.5px;border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:2px 4px;height:26px;max-width:118px;cursor:pointer}
@media (hover:none){
  .hover-actions{opacity:1;position:static;box-shadow:none;border:0;padding:0;margin-top:8px;justify-content:flex-end;background:transparent}
}

/* ================= Table ================= */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}
.tbl th{background:var(--surface-2);text-align:left;font-weight:650;font-size:12px;color:var(--text-2);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.tbl th .arrow{font-size:10px;margin-left:3px;color:var(--primary)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .t-company{font-weight:650}
.tbl .t-sub{font-size:11.5px;color:var(--muted)}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.status-select{border:1px solid var(--c);background:var(--cb);color:var(--c);font-weight:650;border-radius:999px;padding:3px 6px;font-size:12px;cursor:pointer}
.status-select option{color:var(--text);background:var(--surface)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}

/* ================= Empty states ================= */
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .e-title{font-weight:650;color:var(--text);font-size:15px;margin-bottom:4px}
.empty .e-actions{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty.sm{padding:18px 8px;font-size:12.5px}

/* ================= Modals ================= */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay-top{z-index:120;align-items:center}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:780px;display:flex;flex-direction:column;border:1px solid var(--border);animation:pop .16s ease-out}
.modal.lg{max-width:940px}
.modal.sm{max-width:470px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:16px}
.modal-body{padding:18px 20px}
.modal-body p+p{margin-top:8px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 14px 14px;flex-wrap:wrap}
.modal-foot .spacer{flex:1}
.err-list{margin:8px 0 0;padding-left:18px;color:var(--danger);font-size:12.5px;max-height:180px;overflow:auto}
.callout{padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:12px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.error{background:var(--danger-soft);color:var(--danger)}
.callout.ok{background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-top:10px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

/* ================= Forms ================= */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--text-2)}
.req{color:var(--danger)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field .err{font-size:11.5px;color:var(--danger);display:none}
.field.invalid .input{border-color:var(--danger)}
.field.invalid .err{display:block}
.warnmsg{font-size:11.5px;color:var(--warn);font-weight:600}
.salary-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 92px 112px;gap:8px}
.section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.hist-item{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-top:1px solid var(--border)}
.hist-item:first-child{border-top:0}
.hist-item .when{color:var(--muted);font-size:11.5px}
.hist-item .why{color:var(--muted);font-size:11.5px}
.meta-line{font-size:11.5px;color:var(--muted);margin-top:16px;word-break:break-all}
.q-list{counter-reset:q;display:flex;flex-direction:column;gap:10px}
.q-row{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;counter-increment:q}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-num::before{content:"Q" counter(q);font-weight:750;font-size:12px;color:var(--primary)}
.q-head select.input{width:auto;flex:0 1 210px;min-height:30px;padding:4px 8px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;font-weight:550}
.q-head .icon-btn{margin-left:auto}

/* ================= Interview notes ================= */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.note-card{padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .15s}
.note-card:hover{box-shadow:var(--shadow-hover)}
.nc-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nc-company{font-weight:650;overflow-wrap:anywhere}
.nc-title{font-size:12.5px;color:var(--text-2)}
.round-badge{font-size:11px;font-weight:650;background:var(--primary-soft);color:var(--primary);padding:2px 8px;border-radius:999px;white-space:nowrap}
.nc-meta{font-size:12px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.nc-meta .m{display:inline-flex;align-items:center;gap:4px}
.nc-lesson{font-size:12.5px;background:var(--surface-2);border-left:3px solid var(--accent);padding:7px 10px;border-radius:0 6px 6px 0}
.nc-lesson .lbl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.nc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:auto}
.topics{display:flex;flex-wrap:wrap;gap:4px}
.topic{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--surface-3);color:var(--text-2);font-weight:650;white-space:nowrap}
.topic.diff{background:var(--danger-soft);color:var(--danger)}
.ins-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-bottom:16px}
.mini-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini-kpi{padding:4px 0}
.mini-kpi .v{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2}
.mini-kpi .l{font-size:12px;color:var(--muted)}
.qitem{padding:8px 0;border-top:1px solid var(--border);font-size:12.5px}
.qitem:first-child{border-top:0}
.qitem .q-src{font-size:11.5px;color:var(--muted);margin-top:2px}
.qitem .q-src button{font-size:11.5px}
.pre{white-space:pre-wrap}

/* ================= Toasts ================= */
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(400px,calc(100vw - 32px))}
.toast{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:10px 12px 10px 14px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;display:flex;gap:10px;align-items:flex-start;animation:pop .2s ease-out;border-left:4px solid var(--primary)}
.toast.success{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
.toast.info{border-left-color:var(--link)}
.toast .t-msg{flex:1}
.toast .t-act{border:0;background:none;color:var(--link);font-weight:650;cursor:pointer;padding:0 2px}
.toast .t-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}

/* ================= Responsive ================= */
@media (max-width:1240px){
  .status-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:1100px){
  .span-4{grid-column:span 6}
  .span-5,.span-7,.span-8{grid-column:span 12}
}
@media (max-width:900px){
  .appbar-inner{flex-wrap:wrap;gap:10px}
  .tabs{order:3;width:100%;overflow-x:auto}
  .tab{flex:1;justify-content:center;padding:7px 10px}
  .brand-sub{display:none}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}
  .mini-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .container{padding:16px}
  .appbar-inner{padding:10px 16px}
  h1{font-size:20px}
  .status-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .val{font-size:26px}
  .form-grid,.detail-grid{grid-template-columns:minmax(0,1fr)}
  .salary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .overlay{padding:0;align-items:stretch}
  .overlay-top{padding:16px;align-items:center}
  .modal:not(.sm){border-radius:0;min-height:100%;border:0}
  .modal:not(.sm) .modal-foot{border-radius:0;position:sticky;bottom:0}
  .modal-body{padding:16px}
  .bar-row{grid-template-columns:96px 1fr 74px;gap:8px}
  .toolbar select.input,.toolbar input[type=date].input{flex:1 1 140px}
  .board{grid-auto-columns:minmax(240px,82vw)}
  .save-status .txt{max-width:90px;overflow:hidden;text-overflow:ellipsis}
  .tab{font-size:13px}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 21 21"/></svg></span>
      <div>
        <div class="brand-name">Adrian Jobtrack</div>
        <div class="brand-sub">Job search tracker</div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Main sections">
      <button class="tab active" role="tab" data-tab="dashboard" aria-selected="true">Dashboard</button>
      <button class="tab" role="tab" data-tab="tracker" aria-selected="false">Job Tracker <span class="tab-count" id="tabCountJobs">0</span></button>
      <button class="tab" role="tab" data-tab="notes" aria-selected="false">Interview Notes <span class="tab-count" id="tabCountNotes">0</span></button>
    </nav>
    <div class="appbar-actions">
      <span id="saveStatus" class="save-status" role="status" aria-live="polite"><span class="dot"></span><span class="txt">Saved</span></span>
      <span id="syncSlot" class="sync-slot"></span>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light or dark theme" title="Toggle light / dark theme"></button>
      <div class="menu-wrap">
        <button class="btn btn-ghost" id="dataMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">Data <span aria-hidden="true">▾</span></button>
        <div class="menu" id="dataMenu" role="menu" hidden>
          <button type="button" role="menuitem" data-action="export">Export JSON backup</button>
          <button type="button" role="menuitem" data-action="import">Import JSON backup…</button>
          <hr>
          <button type="button" role="menuitem" data-action="cv-manage">CV folder…</button>
          <button type="button" role="menuitem" data-action="cloud-sync">Cloud sync (phone ↔ computer)…</button>
          <hr>
          <button type="button" role="menuitem" data-action="reset-sample">Reset to sample data…</button>
          <button type="button" role="menuitem" data-action="clear-all" class="danger">Clear all data…</button>
          <div class="menu-note">Data is stored in this browser. Sign in to Cloud sync to share it with your other devices.</div>
        </div>
      </div>
    </div>
  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>

<main class="container">
  <!-- ============ DASHBOARD ============ -->
  <section id="tab-dashboard" class="tab-panel" role="tabpanel">
    <div id="dashBody"></div>
  </section>

  <!-- ============ JOB TRACKER ============ -->
  <section id="tab-tracker" class="tab-panel" role="tabpanel" hidden>
    <div class="page-head">
      <div>
        <h1>Job Tracker</h1>
        <p id="trackerSummary"></p>
      </div>
      <div class="head-actions">
        <div class="seg" role="group" aria-label="Tracker view">
          <button type="button" data-action="tracker-view" data-view="kanban">Kanban</button>
          <button type="button" data-action="tracker-view" data-view="table">Table</button>
        </div>
        <button type="button" class="btn btn-primary" data-action="add-job">+ Add Job</button>
      </div>
    </div>
    <div class="toolbar card">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="jobSearch" class="input" type="search" placeholder="Search company, position, contact, notes…" aria-label="Search jobs" autocomplete="off">
      </div>
      <select id="prioFilter" class="input" aria-label="Filter by priority"></select>

<script>
/* CloudSync engine (firebase-realtime-sync) */
/* ============================================================
   CloudSync v1 — real-time sync of an app's state between devices
   (Firebase Auth email/password + Cloud Firestore, loaded from gstatic).

   The app state is split into documents at users/{uid}/parts/{key}.
   Each document holds the JSON in `j`, the client time of the edit in `t`
   and the device id in `dev`. Every signed-in device listens to that
   collection, so an edit shows up on the others within a second or two.
   meta.base[key] = {l: local hash, c: cloud hash} remembers the version this
   device last agreed with the cloud; after offline edits it tells which side
   changed, and the newer edit wins (per document).

   Usage (see references/integration.md):
     CloudSync.init({
       firebaseConfig: {...}, appName: 'My App',
       getState: () => state, setState: s => { state = s; saveLocal(); },
       render: () => render(),

(function () {

  const LABEL = {
    off: 'Sign in to sync', connecting: 'Connecting…', link: 'Finish cloud setup', synced: 'Synced', saving: 'Saving…',
    offline: 'Offline — will sync later', error: 'Sync error', unavailable: 'Cloud sync unavailable',

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function strHash(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }

  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  // dot paths for localOnly: 'settings.activeTab'
  const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o);
  function delPath(o, p) { const ks = p.split('.'), last = ks.pop(); const t = ks.reduce((a, k) => (a == null ? undefined : a[k]), o); if (t && typeof t === 'object') delete t[last]; }

  const CSS = `
.cs-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--cs-border);background:var(--cs-surface2);color:var(--cs-muted);font-family:inherit;font-size:12px;font-weight:600;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cs-pill:hover{color:var(--cs-text)}
.cs-pill[data-compact]{padding:0;width:40px;height:40px;justify-content:center;border:0;background:transparent}
.cs-pill[data-compact] .cs-label{display:none}
.cs-float{position:fixed;z-index:9000;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));box-shadow:0 4px 16px rgba(0,0,0,.25)}
.cs-dot{width:9px;height:9px;border-radius:50%;background:var(--cs-muted);flex:none;display:inline-block}

[data-cs-state="saving"] .cs-dot,[data-cs-state="connecting"] .cs-dot{background:#ffc547;animation:csPulse 1s ease-in-out infinite}
[data-cs-state="error"] .cs-dot,[data-cs-state="unavailable"] .cs-dot{background:#ff5d5d}
[data-cs-state="link"] .cs-dot{background:#5ab0ff}

.cs-root{--cs-surface:var(--surface,#16181c);--cs-surface2:var(--surface2,#1e2127);--cs-border:var(--border,#2a2e36);--cs-text:var(--text,#eef0f3);--cs-muted:var(--muted,#8b919c);--cs-accent:var(--accent,#c6ff3d);--cs-ink:var(--accent-ink,#0e0f11);--cs-danger:var(--danger,#ff5d5d)}

.cs-modal{background:var(--cs-surface);color:var(--cs-text);border:1px solid var(--cs-border);border-radius:16px;width:100%;max-width:460px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cs-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--cs-border)}
.cs-head b{font-size:15px}
.cs-x{border:0;background:transparent;color:var(--cs-muted);font-size:22px;line-height:1;cursor:pointer;width:36px;height:36px}

.cs-input:focus{border-color:var(--cs-accent)}

.cs-btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--cs-border);background:var(--cs-surface2);color:var(--cs-text);font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}
.cs-btn.primary{background:var(--cs-accent);color:var(--cs-ink);border-color:transparent}
.cs-btn.danger{background:transparent;color:var(--cs-danger)}
.cs-btn.link{border:0;background:transparent;color:var(--cs-muted);height:auto;padding:0;font-size:13px}
.cs-btn.left{margin-right:auto}
.cs-toasts{position:fixed;z-index:9600;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}

@keyframes csFade{from{opacity:0}}
@media (max-width:640px){
  .cs-backdrop{place-items:end center;padding:max(12px,env(safe-area-inset-top)) 0 0}
  .cs-modal{max-width:none;border-radius:18px 18px 0 0;border-bottom:0;max-height:calc(100dvh - max(12px,env(safe-area-inset-top)))}
  .cs-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .cs-foot .cs-btn{flex:1 1 auto;height:46px}
  .cs-foot .cs-btn.left{flex:0 0 auto}
}`;

  const CloudSync = {
    opts: null, fs: null, authApi: null, auth: null, db: null, user: null, unsub: null,
    state: 'off', merged: false, merging: false, applying: false, linking: false, timer: null, pending: 0,
    inflight: {}, tooBig: {}, cloudSnapshot: null, pendingRender: false, lastSync: null, lastError: '',
    meta: { uid: null, linked: false, base: {}, lt: {} }, dev: null, ns: 'cs',

    /* ---------- setup ---------- */
    init(opts) {
      if (this.opts) return this;
      if (!opts || !opts.firebaseConfig || !opts.getState || !opts.setState) throw new Error('CloudSync.init needs firebaseConfig, getState and setState');
      this.opts = { localOnly: [], sdk: 'https://www.gstatic.com/firebasejs/' + SDK_VERSION + '/', ...opts };
      this.ns = 'cs.' + (opts.storageKey || opts.firebaseConfig.projectId || 'app');
      this.dev = lsGet(this.ns + '.device') || rid(); lsSet(this.ns + '.device', this.dev);
      this.injectCSS(); this.mountPills();
      window.addEventListener('online', () => { this.push(); this.settle(); });
      window.addEventListener('offline', () => { if (this.user) this.setState('offline'); });
      setInterval(() => { if (this.pendingRender) this.rerender(); }, 1000);
      this.setState('off');
      if (!opts.manualStart) this.start();
      return this;
    },
    injectCSS() {
      if (document.getElementById('cs-style')) return;
      const st = document.createElement('style'); st.id = 'cs-style'; st.textContent = CSS; document.head.appendChild(st);
    },
    mountPills() {
      const m = this.opts.mount;
      let els = [];
      if (m === false) return;
      if (typeof m === 'string') els = [...document.querySelectorAll(m)];
      else if (m && m.nodeType) els = [m];
      else if (Array.isArray(m)) els = m.flatMap(x => (typeof x === 'string' ? [...document.querySelectorAll(x)] : [x]));
      const mk = (host, float) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cs-pill cs-root' + (float ? ' cs-float' : ''); b.dataset.csPill = '';
        if (float || (host && host.hasAttribute && host.hasAttribute('data-cs-compact'))) b.dataset.compact = '';
        b.innerHTML = '<i class="cs-dot"></i><span class="cs-label"></span>';
        b.addEventListener('click', () => this.open());
        (host || document.body).appendChild(b);
      };
      if (els.length) els.forEach(h => mk(h, false)); else mk(null, true);
    },

    /* ---------- bookkeeping ---------- */
    loadMeta(id) {
      let m = null;
      try { m = JSON.parse(lsGet(this.ns + '.meta') || 'null'); } catch (e) {}
      this.meta = m && m.uid === id ? { linked: false, base: {}, lt: {}, ...m } : { uid: id, linked: false, base: {}, lt: {} };
    },
    saveMeta() { lsSet(this.ns + '.meta', JSON.stringify(this.meta)); },
    // A copy of the app state without the per-device keys.
    sharedCopy() {
      const c = JSON.parse(JSON.stringify(this.opts.getState() || {}));
      this.opts.localOnly.forEach(p => delPath(c, p));
      return c;
    },
    // The app state as documents: key -> { h: hash, s(): JSON string }.
    parts() {
      const c = this.sharedCopy();
      const obj = this.opts.split ? this.opts.split(c) : c;
      const out = {};
      Object.keys(obj || {}).forEach(k => { if (obj[k] === undefined) return; const s = JSON.stringify(obj[k]); out[k] = { h: strHash(s), s: () => s }; });
      return out;
    },
    // Rebuild the app state from parsed documents, keeping this device's local-only keys.
    assemble(cur) {
      let s = this.opts.join ? this.opts.join(cur) : { ...cur };
      const now = this.opts.getState() || {};
      this.opts.localOnly.forEach(p => { const v = getPath(now, p); if (v !== undefined) setPath(s, p, v); });
      if (this.opts.migrate) s = this.opts.migrate(s) || s;

    },
    describe(state) {
      if (this.opts.describe) { try { return this.opts.describe(state); } catch (e) {} }
      const n = Object.keys(state || {}).length;

    },

    /* ---------- applying cloud changes ---------- */
    async applyRemote(changes) {
      if (!changes.length) return;
      this.applying = true;
      try {
        const P = this.parts(), cur = {};
        Object.keys(P).forEach(k => { cur[k] = JSON.parse(P[k].s()); });
        changes.forEach(c => { if (c.j == null) delete cur[c.k]; else cur[c.k] = JSON.parse(c.j); });
        await this.opts.setState(this.assemble(cur));
      } finally { this.applying = false; }
      const P = this.parts();
      changes.forEach(c => {
        if (c.j == null) delete this.meta.base[c.k];

    },
    busy() {

    rerender() {

      try { this.opts.render(); } catch (e) { console.warn('CloudSync: render failed', e); }
    },

    /* ---------- pushing local changes ---------- */
    changed() { this.queue(); },
    queue() {
      if (!this.merged || this.applying) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.push(), 500);
    },
    push() {
      clearTimeout(this.timer);
      if (!this.merged || !this.user || this.applying) return;

      const sets = Object.keys(P).filter(k => (!B[k] || B[k].l !== P[k].h) && this.inflight[k] !== P[k].h);
      const dels = Object.keys(B).filter(k => !P[k] && this.inflight[k] !== 'del');
      if (!sets.length && !dels.length) return;
      const { doc, setDoc, deleteDoc } = this.fs;
      const ref = k => doc(this.db, 'users', this.user.uid, 'parts', docId(k));

        this.inflight[k] = tag; this.pending++;

        run(k, 'del', deleteDoc(ref(k)), () => { delete this.meta.base[k]; this.saveMeta(); });

    settle() {

    async start() {

      this.setState('connecting');

        const sdk = this.opts.sdk;
        const [appMod, authMod, fsMod] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(sdk + f)));

      } catch (e) {

        this.setState('unavailable');
      }
    },
    onUser(u) {
      if (this.unsub) { this.unsub(); this.unsub = null; }
      this.user = u || null; this.merged = false; this.cloudSnapshot = null; this.lastError = '';
      if (!u) { this.setState('off'); return; }

      this.setState('connecting');
      const col = this.fs.collection(this.db, 'users', u.uid, 'parts');

    },
    onSnap(snap) {

        if (snap.metadata.fromCache) return; // wait for the server's answer
        const cloud = {};
        snap.forEach(d => { const v = d.data(); cloud[keyOf(d.id)] = { j: v.j, t: v.t || 0 }; });

        if (!this.meta.linked) { this.setState('link'); this.linkDialog(); }
        else if (!this.merging) { this.merging = true; this.firstMerge(cloud).finally(() => { this.merging = false; }); }
        return;
      }

        const d = ch.doc;

        if (ch.type === 'removed') { if (b) changes.push({ k, j: null, t: Date.now() }); return; }
        const v = d.data();
        if (b && b.c === strHash(v.j)) return; // already have this version
        changes.push({ k, j: v.j, t: v.t || 0 });
      });
      if (!changes.length) return;
      const P = this.parts();
      // keep a local edit that is newer than the incoming one; push() sends it afterwards
      const take = changes.filter(c => {
        const b = this.meta.base[c.k], L = P[c.k];

    },
    // Reconcile after this device was offline or closed: per document, whichever side changed wins.
    async firstMerge(cloud) {
      const P = this.parts(), B = this.meta.base, lt = this.meta.lt;
      const take = [];
      new Set([...Object.keys(P), ...Object.keys(cloud), ...Object.keys(B)]).forEach(k => {
        const L = P[k], C = cloud[k], b = B[k], cH = C ? strHash(C.j) : null;
        if (L && C) {

          const editedHere = !b || b.l !== L.h, editedThere = !b || b.c !== cH;

  };
  window.CloudSync = CloudSync;
})();

<script>
(function(){

const D = {
  pad: n => String(n).padStart(2,'0'),
  toISO(d){ return d.getFullYear()+'-'+D.pad(d.getMonth()+1)+'-'+D.pad(d.getDate()); },
  today(){ return D.toISO(new Date()); },
  parse(s){
    if (typeof s !== 'string') return null;
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.trim());
    if (!m) return null;
    const y=+m[1], mo=+m[2], d=+m[3];
    const dt = new Date(y, mo-1, d);
    if (dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return null;
    return dt;
  },
  valid(s){ return !!D.parse(s); },
  addDays(s, n){ const d = D.parse(s); d.setDate(d.getDate()+n); return D.toISO(d); },

  },
  fmt(s){ const d=D.parse(s); return d ? D.pad(d.getDate())+'/'+D.pad(d.getMonth()+1)+'/'+d.getFullYear() : '—'; },
  fmtShort(s){ const d=D.parse(s); return d ? D.pad(d.getDate())+'/'+D.pad(d.getMonth()+1) : ''; },
  fmtDT(iso){ const d=new Date(iso); if (isNaN(d)) return '—'; return D.pad(d.getDate())+'/'+D.pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+D.pad(d.getHours())+':'+D.pad(d.getMinutes()); },
  fmtTime(iso){ const d=new Date(iso); return isNaN(d) ? '' : D.pad(d.getHours())+':'+D.pad(d.getMinutes()); },
  localDateOf(iso){ const d=new Date(iso); return isNaN(d) ? null : D.toISO(d); },
  rel(iso){
    const d=new Date(iso); if (isNaN(d)) return '';
    const mins = Math.round((Date.now()-d.getTime())/60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins+' min ago';
    const hrs = Math.round(mins/60);
    if (hrs < 24) return hrs+'h ago';
    const days = D.diff(D.toISO(d), D.today());
    if (days === 1) return 'yesterday';
    if (days < 7) return days+' days ago';
    return D.fmt(D.toISO(d));

}
function isQuotaError(e){
  return !!e && (e.name==='QuotaExceededError' || e.name==='NS_ERROR_DOM_QUOTA_REACHED' || e.code===22 || e.code===1014);

const Store = {
  state: null,
  available: false,
  timer: null,
  init(){
    this.available = storageAvailable();
    if (!this.available){
      this.state = normalizedSample();
      showBanner('error', 'Browser storage (localStorage) is not available — for example in private mode or when site data is blocked. You can explore the app, but changes will NOT be kept after you close this page. Use Data → Export JSON backup to keep your work.');

      return 'unavailable';

      this.state = normalizedSample();
      this.save();
      return 'seeded';
    }
    let parsed;
    try { parsed = JSON.parse(raw); } catch(e){ parsed = undefined; }

      const key = backupRaw(raw);
      this.state = emptyState();
      showBanner('error', `Your saved data could not be read (${esc(res.errors[0])}). ${key ? 'An untouched copy was kept in browser storage under "'+esc(key)+'". ' : ''}The app started with an empty workspace — import a JSON backup to restore your data.`);
      setSaveStatus('saved');
      return 'corrupt';
    }
    this.state = res.state;
    const problems = res.errors.length + res.warnings.length;
    if (problems){
      const key = backupRaw(raw);
      showBanner('warn', `${plural(problems,'problem')} found while loading saved data (${esc((res.errors.concat(res.warnings))[0])}${problems>1?', …':''}). Invalid records or fields were skipped.${key ? ' A copy of the original data was kept under "'+esc(key)+'".' : ''}`);

    setSaveStatus('saved');

  save(){
    if (!this.available){ setSaveStatus('unavailable'); return false; }

      this.state.meta.savedAt = nowISO();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));

      this.timer = setTimeout(() => setSaveStatus('saved'), 380);

      const quota = isQuotaError(e);
      setSaveStatus('failed', quota ? 'Browser storage is full' : 'Storage error: '+(e && e.message || e));
      toast(quota ? 'Save failed: browser storage is full. Export a backup, then remove old data.' : 'Save failed: '+(e && e.message || 'storage error')+'. Your latest change is not stored yet.', 'error', {duration:8000});

  }

function backupRaw(raw){
  const key = STORAGE_KEY+'.backup-'+Date.now();
  try { localStorage.setItem(key, raw); return key; } catch(e){ return null; }
}

/* ---------- validation / normalisation (used for load + import) ---------- */
const nStr = v => v==null ? '' : String(v);
function nTs(v, fallback){
  if (typeof v === 'string' || typeof v === 'number'){ const d = new Date(v); if (!isNaN(d)) return d.toISOString(); }
  return fallback;
}
function nDate(v, label, warns){
  if (v==null || v==='') return '';
  if (typeof v==='string' && D.valid(v)) return v.trim();
  warns.push(`${label} "${v}" is not a valid date (YYYY-MM-DD)`);
  return '';
}
function nNum(v, label, warns){
  if (v==null || v==='') return null;
  const n = Number(v);
  if (!isFinite(n) || n < 0){ warns.push(`${label} "${v}" is not a valid amount`); return null; }
  return n;
}
function normalizeJob(j){
  const errs=[], warns=[];
  if (!j || typeof j!=='object' || Array.isArray(j)) return { errs:['is not an object'], warns };
  if (typeof j.id!=='string' || !j.id.trim()) errs.push('has no id');
  const company = nStr(j.company).trim(), title = nStr(j.title).trim();
  if (!company) errs.push('has no company name');
  if (!title) errs.push('has no job title');
  if (!STATUSES.includes(j.status)) errs.push(`has invalid status "${j.status}"`);
  let currency = j.currency ? String(j.currency).toUpperCase() : 'VND';
  if (!CURRENCIES.includes(currency)){ warns.push(`unsupported currency "${j.currency}"`); currency = 'VND'; }
  const createdAt = nTs(j.createdAt, nowISO());
  const updatedAt = nTs(j.updatedAt, createdAt);
  let history = Array.isArray(j.history) ? j.history.filter(h => h && STATUSES.includes(h.to)).map(h => ({
    from: STATUSES.includes(h.from) ? h.from : null,
    to: h.to,
    at: nTs(h.at, createdAt),
    source: ['create','user','auto','import'].includes(h.source) ? h.source : 'user',
    reason: nStr(h.reason)
  })) : [];
  if (!history.length && STATUSES.includes(j.status)) history = [{from:null, to:j.status, at:createdAt, source:'import', reason:'Status at import (no history available)'}];
  let min = nNum(j.salaryMin,'Salary min',warns), max = nNum(j.salaryMax,'Salary max',warns);
  if (min!=null && max!=null && min>max){ const t=min; min=max; max=t; }
  const job = {
    id: nStr(j.id).trim(), company, title, status: j.status,
    priority: PRIORITIES.includes(j.priority) ? j.priority : DEFAULT_PRIORITY,
    category: nStr(j.category).trim(),
    salaryMin: min, salaryMax: max, currency,
    salaryPeriod: j.salaryPeriod==='Annual' ? 'Annual' : 'Monthly',
    applicationDate: nDate(j.applicationDate,'Application date',warns),
    deadline: nDate(j.deadline,'Deadline',warns),
    contactPerson: nStr(j.contactPerson).trim(),
    contactInfo: nStr(j.contactInfo).trim(),
    // v1 stored only a JD link (jdUrl); carry it into the text so nothing is lost
    jobDescription: nStr(j.jobDescription).slice(0, JD_MAX) || (nStr(j.jdUrl).trim() ? 'Job description link: '+nStr(j.jdUrl).trim() : ''),
    cvUrl: /^https?:\/\//i.test(nStr(j.cvUrl).trim()) ? nStr(j.cvUrl).trim() : '',   // only web links are ever turned into clickable links
    cvFile: cleanCvPath(j.cvFile),
    notes: nStr(j.notes),
    createdAt, updatedAt,
    appliedClockStart: (typeof j.appliedClockStart==='string' && D.valid(j.appliedClockStart)) ? j.appliedClockStart : null,
    history
  };
  return { job, errs, warns };
}
function normalizeNote(n){
  const errs=[], warns=[];
  if (!n || typeof n!=='object' || Array.isArray(n)) return { errs:['is not an object'], warns };
  if (typeof n.id!=='string' || !n.id.trim()) errs.push('has no id');
  const company = nStr(n.company).trim();
  if (!company) errs.push('has no company name');
  const createdAt = nTs(n.createdAt, nowISO());
  const questions = Array.isArray(n.questions) ? n.questions.filter(q => q && typeof q==='object').map(q => ({
    id: typeof q.id==='string' && q.id ? q.id : uid('q'),

    difficult: !!q.difficult
  })) : [];
  const note = {

    round: nStr(n.round).trim(), interviewer: nStr(n.interviewer).trim(),
    format: FORMATS.includes(n.format) ? n.format : '',
    questions,
    knowledgeGaps: nStr(n.knowledgeGaps), lessons: nStr(n.lessons),
    improvementPlan: nStr(n.improvementPlan), additionalNotes: nStr(n.additionalNotes),

  return { note, errs, warns };

/** Validate a parsed object (raw state or an export wrapper). */
function validateData(raw){
  let data = raw;
  if (raw && typeof raw==='object' && !Array.isArray(raw) && raw.data && typeof raw.data==='object' && !Array.isArray(raw.data) && (raw.app===APP_NAME || raw.schemaVersion!=null)) data = raw.data;
  if (!data || typeof data!=='object' || Array.isArray(data)) return { fatal:true, errors:['the file does not contain an Adrian Jobtrack data object'] };
  if (!Array.isArray(data.jobs)) return { fatal:true, errors:['the "jobs" list is missing'] };
  if (data.notes!=null && !Array.isArray(data.notes)) return { fatal:true, errors:['"notes" must be a list'] };
  const errors=[], warnings=[], jobs=[], notes=[], jobIds=new Set(), noteIds=new Set();
  data.jobs.forEach((j,i) => {
    const r = normalizeJob(j);
    const name = `Job #${i+1}${j && j.company ? ' ('+String(j.company).slice(0,40)+')' : ''}`;
    r.warns.forEach(w => warnings.push(`${name}: ${w}`));
    if (r.errs.length){ errors.push(`${name} ${r.errs.join(', ')}`); return; }
    if (jobIds.has(r.job.id)){ errors.push(`${name} has a duplicate id`); return; }
    jobIds.add(r.job.id); jobs.push(r.job);
  });
  (data.notes||[]).forEach((n,i) => {
    const r = normalizeNote(n);
    const name = `Interview note #${i+1}`;
    r.warns.forEach(w => warnings.push(`${name}: ${w}`));
    if (r.errs.length){ errors.push(`${name} ${r.errs.join(', ')}`); return; }
    if (noteIds.has(r.note.id)){ errors.push(`${name} has a duplicate id`); return; }
    noteIds.add(r.note.id); notes.push(r.note);
  });
  const activity = Array.isArray(data.activity) ? data.activity.filter(a => a && typeof a.type==='string' && !isNaN(new Date(a.at))).map(a => ({
    id: typeof a.id==='string' ? a.id : uid('act'), at: new Date(a.at).toISOString(), type: a.type,
    jobId: typeof a.jobId==='string' ? a.jobId : null, noteId: typeof a.noteId==='string' ? a.noteId : null,
    company: nStr(a.company), title: nStr(a.title), message: nStr(a.message)
  })) : [];
  const ds = defaultSettings(), s = (data.settings && typeof data.settings==='object') ? data.settings : {};
  const settings = {
    theme: ['system','light','dark'].includes(s.theme) ? s.theme : ds.theme,
    trackerView: ['kanban','table'].includes(s.trackerView) ? s.trackerView : ds.trackerView,
    notesView: ['cards','table'].includes(s.notesView) ? s.notesView : ds.notesView,
    customCategories: Array.isArray(s.customCategories) ? s.customCategories.map(nStr).map(x=>x.trim()).filter(Boolean) : []
  };
  const meta = { createdAt: nTs(data.meta && data.meta.createdAt, nowISO()), savedAt: nTs(data.meta && data.meta.savedAt, null) };
  return { fatal:false, errors, warnings, state:{ version:SCHEMA_VERSION, jobs, notes, activity, settings, meta } };
}

/* =========================================================
   5. BUSINESS RULES
   ========================================================= */
const findJob = id => S().jobs.find(j => j.id===id) || null;
const findNote = id => S().notes.find(n => n.id===id) || null;
const notesForJob = id => S().notes.filter(n => n.jobId===id);

function countByStatus(jobs){
  const c = {}; STATUSES.forEach(s => c[s]=0);
  jobs.forEach(j => { if (c[j.status]!=null) c[j.status]++; });
  return c;
}
/** A job "ever reached" a status only if its recorded history (or current status) says so. */
function everReached(job, status){
  return job.status===status || job.history.some(h => h.to===status);
}
function deadlineInfo(job, t){
  if (!D.valid(job.deadline)) return null;
  t = t || D.today();
  const days = D.diff(t, job.deadline);
  let bucket, label;
  if (days < 0){ bucket='overdue'; label = 'Overdue '+(-days)+'d'; }
  else if (days === 0){ bucket='urgent'; label='Due today'; }
  else if (days <= URGENT_DAYS){ bucket='urgent'; label = days===1 ? 'Due tomorrow' : 'Due in '+days+'d'; }
  else if (days <= UPCOMING_DAYS){ bucket='upcoming'; label='Due in '+days+'d'; }
  else { bucket='ontrack'; label='Due in '+days+'d'; }
  return { days, bucket, label };
}
/** Start date of the 14-day clock: Application Date, or the day the job was manually moved back to Applied (if later). */
function appliedClock(job){
  if (!D.valid(job.applicationDate)) return null;
  let c = job.applicationDate;
  if (job.appliedClockStart && D.valid(job.appliedClockStart) && job.appliedClockStart > c) c = job.appliedClockStart;
  return c;
}
function daysUntilAuto(job){
  const c = appliedClock(job);
  return c ? AUTO_NO_RESPONSE_DAYS - D.diff(c, D.today()) : null;
}
function daysInNoResponse(job){
  if (job.status!=='No Response') return null;
  for (let i=job.history.length-1; i>=0; i--){
    if (job.history[i].to==='No Response'){ const d = D.localDateOf(job.history[i].at); return d ? Math.max(0, D.diff(d, D.today())) : 0; }
  }
  const d = D.localDateOf(job.updatedAt); return d ? Math.max(0, D.diff(d, D.today())) : 0;
}
function salaryValue(job){
  const a=job.salaryMin, b=job.salaryMax;
  if (a!=null && b!=null) return (a+b)/2;
  if (a!=null) return a;
  if (b!=null) return b;
  return null;
}

/* ---------- mutations (all changes go through here) ---------- */
function logActivity(type, job, message, at, noteId){
  const st = S();
  st.activity.push({ id:uid('act'), at: at || nowISO(), type, jobId: job ? job.id : null, noteId: noteId || null, company: job ? job.company : '', title: job ? job.title : '', message });
  if (st.activity.length > MAX_ACTIVITY) st.activity.splice(0, st.activity.length - MAX_ACTIVITY);
}
function setStatus(job, next, source, reason){
  const from = job.status;
  if (from === next || !STATUSES.includes(next)) return false;
  const at = nowISO();
  job.history.push({ from, to:next, at, source, reason: reason || (source==='auto' ? 'Automatic rule' : 'Changed manually') });
  job.status = next;
  job.updatedAt = at;
  if (next==='Applied' && source==='user') job.appliedClockStart = D.today(); // restart the 14-day clock
  logActivity(source==='auto' ? 'auto' : 'status', job, (source==='auto' ? 'Auto: ' : 'Status: ')+from+' → '+next, at);
  return true;
}
function createJob(data){
  const at = nowISO();
  const job = Object.assign({
    id: uid('job'), company:'', title:'', status:'Applied', priority:DEFAULT_PRIORITY, category:'', salaryMin:null, salaryMax:null, currency:'VND', salaryPeriod:'Monthly',
    applicationDate:'', deadline:'', contactPerson:'', contactInfo:'', jobDescription:'', cvFile:'', cvUrl:'', notes:''
  }, data, { createdAt:at, updatedAt:at, appliedClockStart:null });
  job.history = [{ from:null, to:job.status, at, source:'create', reason:'Job created' }];
  S().jobs.push(job);
  logActivity('create', job, 'Created ('+job.status+')', at);
  rememberCategory(job.category);
  return job;
}
const JOB_FIELDS = ['company','title','priority','category','salaryMin','salaryMax','currency','salaryPeriod','applicationDate','deadline','contactPerson','contactInfo','jobDescription','cvFile','cvUrl','notes'];
function updateJob(job, data){
  const changed = JOB_FIELDS.filter(f => String(job[f]==null?'':job[f]) !== String(data[f]==null?'':data[f]));
  changed.forEach(f => { job[f] = data[f]; });
  if (changed.length){
    job.updatedAt = nowISO();
    const labels = Array.from(new Set(changed.map(f => FIELD_LABELS[f])));
    logActivity('edit', job, 'Edited '+labels.join(', '));
  }
  if (changed.includes('company') || changed.includes('title')){
    // keep linked notes readable: refresh their copy only if they still mirror the job
    notesForJob(job.id).forEach(n => { if (!n.company) n.company = job.company; });
  }
  const statusChanged = data.status && data.status!==job.status ? setStatus(job, data.status, 'user') : false;
  rememberCategory(job.category);
  return changed.length>0 || statusChanged;
}
function removeJob(id){
  const st = S(), i = st.jobs.findIndex(j => j.id===id);
  if (i<0) return null;
  const [job] = st.jobs.splice(i,1);
  logActivity('delete', job, 'Deleted job');
  return job;
}
function rememberCategory(cat){
  if (!cat) return;
  const s = S().settings;
  const known = PRESET_CATEGORIES.concat(s.customCategories).map(x=>x.toLowerCase());
  if (!known.includes(cat.toLowerCase())) s.customCategories.push(cat);
}
function allCategories(){
  const set = new Map();
  PRESET_CATEGORIES.concat(S().settings.customCategories, S().jobs.map(j=>j.category)).forEach(c => { if (c && !set.has(c.toLowerCase())) set.set(c.toLowerCase(), c); });
  return Array.from(set.values());
}

/** Applied -> No Response after 14 days. Returns moved jobs and Applied jobs that cannot be evaluated. */
function runAutoStatus(){
  const t = D.today(), moved = [], missing = [];
  S().jobs.forEach(job => {
    if (job.status!=='Applied') return;
    const clock = appliedClock(job);
    if (!clock){ missing.push(job); return; }
    if (D.diff(clock, t) >= AUTO_NO_RESPONSE_DAYS){
      const restarted = clock !== job.applicationDate;
      const eligible = D.addDays(clock, AUTO_NO_RESPONSE_DAYS);
      setStatus(job, 'No Response', 'auto',
        `No response ${AUTO_NO_RESPONSE_DAYS} days after ${restarted ? 'being moved back to Applied' : 'application'} on ${D.fmt(clock)} (eligible since ${D.fmt(eligible)})`);
      moved.push(job);
    }
  });
  return { moved, missing };
}

function fmtNum(v, cur){ return new Intl.NumberFormat('en-US', { maximumFractionDigits: cur==='VND' ? 0 : 2 }).format(v); }
function compactNum(v){
  const a = Math.abs(v), r = x => String(Math.round(x*10)/10);
  if (a >= 1e9) return r(v/1e9)+'B';
  if (a >= 1e6) return r(v/1e6)+'M';
  if (a >= 1e4) return r(v/1e3)+'K';
  return fmtNum(v);
}
function salaryText(j, compact){
  const a=j.salaryMin, b=j.salaryMax;
  if (a==null && b==null) return '';
  const f = v => compact ? compactNum(v) : fmtNum(v, j.currency);
  let s;
  if (a!=null && b!=null) s = a===b ? f(a) : f(a)+' – '+f(b);
  else if (a!=null) s = 'From '+f(a);
  else s = 'Up to '+f(b);
  return s+' '+j.currency+(j.salaryPeriod==='Annual' ? '/yr' : '/mo');
}

function toast(msg, type, opts){
  type = type || 'success'; opts = opts || {};
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.setAttribute('role', type==='error' ? 'alert' : 'status');
  t.innerHTML = `<span class="t-msg">${esc(msg)}</span>${opts.action ? `<button type="button" class="t-act">${esc(opts.action.label)}</button>` : ''}<button type="button" class="t-x" aria-label="Dismiss">×</button>`;
  const close = () => t.remove();
  t.querySelector('.t-x').onclick = close;
  if (opts.action) t.querySelector('.t-act').onclick = () => { close(); opts.action.fn(); };
  box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(close, opts.duration || (type==='error' ? 7000 : 3800));
}
function confirmDialog(o){
  return new Promise(resolve => {
    const root = $('#confirmRoot');
    root.innerHTML = `<div class="modal sm" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle"><div class="modal-head"><h2 id="cfTitle">${esc(o.title)}</h2></div><div class="modal-body">${o.message||''}</div><div class="modal-foot"><button type="button" class="btn" data-c="0">${esc(o.cancelText||'Cancel')}</button><button type="button" class="btn ${o.danger?'btn-danger':'btn-primary'}" data-c="1">${esc(o.confirmText||'Confirm')}</button></div></div>`;
    root.hidden = false;
    const prev = document.activeElement;
    const onKey = e => { if (e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); done(false); } };
    const done = v => { root.hidden = true; root.innerHTML = ''; root.onclick = null; document.removeEventListener('keydown', onKey, true); try { prev && prev.focus && prev.focus(); } catch(e){} resolve(v); };
    root.onclick = e => { const b = e.target.closest('[data-c]'); if (b) done(b.dataset.c==='1'); else if (e.target===root) done(false); };
    document.addEventListener('keydown', onKey, true);
    root.querySelector('[data-c="1"]').focus();
  });
}
const Modal = {
  root: null, dirty: false, lastFocus: null, downOnBackdrop: false,
  isOpen(){ return !!this.root && !this.root.hidden; },
  open({ title, body, footer, size, onMount }){
    const r = this.root;
    this.lastFocus = document.activeElement;
    r.innerHTML = `<div class="modal ${size||''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">${title}</h2><button type="button" class="icon-btn" data-action="modal-close" aria-label="Close">${ICON('x',18)}</button></div><div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
    r.hidden = false;
    r.scrollTop = 0;
    document.body.classList.add('no-scroll');
    this.dirty = false;
    const m = r.querySelector('.modal');
    const mark = e => { if (e.target.closest('.modal-body')) this.dirty = true; };
    m.addEventListener('input', mark); m.addEventListener('change', mark);
    if (onMount) onMount(m);
    const f = m.querySelector('[autofocus]') || m.querySelector('.modal-body input, .modal-body select, .modal-body textarea') || m.querySelector('.modal-foot .btn-primary');
    if (f) setTimeout(() => { try { f.focus(); } catch(e){} }, 30);
  },
  async close(force){
    if (!this.isOpen()) return true;
    if (!force && this.dirty){
      const ok = await confirmDialog({ title:'Discard unsaved changes?', message:'<p>You have edits in this form that have not been saved.</p>', confirmText:'Discard changes', cancelText:'Keep editing', danger:true });
      if (!ok) return false;
    }
    this.root.hidden = true; this.root.innerHTML = ''; this.dirty = false;
    document.body.classList.remove('no-scroll');
    try { if (this.lastFocus && document.contains(this.lastFocus)) this.lastFocus.focus(); } catch(e){}
    return true;
  }
};
async function swapModal(fn){ if (Modal.isOpen() && !(await Modal.close())) return; fn(); }

function buildInsights(){
  const out = [], t = D.today();
  S().jobs.forEach(j => {
    const term = TERMINAL.has(j.status), dl = deadlineInfo(j, t), co = j.company;
    if (j.status==='Offer'){
      out.push({ sev: dl && dl.days<=URGENT_DAYS ? 'high' : 'med', jobId:j.id,
        title:`Offer from ${co} is waiting for your decision`,
        detail: dl ? `${j.title} · response deadline ${D.fmt(j.deadline)} (${dl.label.toLowerCase()})` : `${j.title} · no response deadline set — confirm the timeline with the employer`,
        rule:'Status is Offer' });
    } else if (!term && dl && dl.bucket!=='ontrack'){
      const map = { overdue:['high',`Deadline passed — ${co}`,'Deadline is before today (open job)'], urgent:['high',`Deadline ${dl.label.toLowerCase()} — ${co}`,`Deadline within 0–${URGENT_DAYS} days`], upcoming:['med',`Deadline coming up — ${co}`,`Deadline within ${URGENT_DAYS+1}–${UPCOMING_DAYS} days`] }[dl.bucket];
      out.push({ sev:map[0], jobId:j.id, title:map[1], detail:`${j.title} · ${j.status} · due ${D.fmt(j.deadline)}${dl.days<0 ? ' ('+plural(-dl.days,'day')+' ago)' : ''}`, rule:map[2] });
    }
    if (j.status==='No Response'){
      const n = daysInNoResponse(j);
      out.push({ sev: n>=FOLLOW_UP_URGENT_DAYS ? 'high' : 'med', jobId:j.id,
        title: n>=FOLLOW_UP_URGENT_DAYS ? `Follow up with ${co} — ${plural(n,'day')} in No Response` : `Send a follow-up to ${co}`,
        detail:`${j.title} · moved to No Response ${n===0 ? 'today' : plural(n,'day')+' ago'}`,
        rule: n>=FOLLOW_UP_URGENT_DAYS ? `In No Response for ${FOLLOW_UP_URGENT_DAYS}+ days` : 'Status is No Response' });
    }
    if (j.status==='Applied'){
      const left = daysUntilAuto(j);
      if (left==null) out.push({ sev:'high', jobId:j.id, title:`Add the application date — ${co}`, detail:`${j.title} · the ${AUTO_NO_RESPONSE_DAYS}-day No Response rule cannot run without it`, rule:'Applied job with an empty or invalid Application Date' });
      else if (left>0 && left<=4) out.push({ sev:'low', jobId:j.id, title:`${co} moves to No Response in ${plural(left,'day')}`, detail:`${j.title} · consider a polite follow-up email now`, rule:`Applied for ${AUTO_NO_RESPONSE_DAYS-4}–${AUTO_NO_RESPONSE_DAYS-1} days without a response` });
    } else if (!term && !D.valid(j.applicationDate)){
      out.push({ sev:'low', jobId:j.id, title:`Missing application date — ${co}`, detail:j.title, rule:'Application Date is empty (open job)' });
    }
    if (j.status==='Interview' && notesForJob(j.id).length===0){
      out.push({ sev:'med', jobId:j.id, action:'add-note', title:`No interview notes yet — ${co}`, detail:`${j.title} · record the questions and lessons while they are fresh`, rule:'Status is Interview and no interview note is linked' });
    }
    if ((j.status==='Interview' || j.status==='Offer') && !j.contactPerson && !j.contactInfo){
      out.push({ sev:'low', jobId:j.id, title:`Missing contact details — ${co}`, detail:j.title, rule:'Interview/Offer job without contact person or contact information' });
    }
  });
  const rank = { high:0, med:1, low:2 };
  // within the same severity, reminders for higher-priority jobs come first
  const pr = id => { const j = findJob(id); return PRIORITY_RANK[j && j.priority] || PRIORITY_RANK[DEFAULT_PRIORITY]; };
  out.forEach(i => { const j = findJob(i.jobId); if (j && j.priority==='High') i.detail = 'High priority · '+i.detail; });
  return out.sort((a,b) => rank[a.sev]-rank[b.sev] || pr(b.jobId)-pr(a.jobId));
}

    : emptySm(by.High.all.length ? 'No open high-priority applications — they are all closed.' : 'No high-priority jobs yet. Set Priority to High when you add or edit a job.');
  return `<div class="prio-wrap">
      <div><div class="prio-tiles">${tiles}</div><div class="prio-mix"><div class="subhead">Status mix by priority</div>${mix}</div></div>
