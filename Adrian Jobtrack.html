function filteredJobs(){
  const f = App.filters, q = f.q.trim().toLowerCase(), t = D.today();
  const list = S().jobs.filter(j => {
    if (f.statuses.size && !f.statuses.has(j.status)) return false;
    if (f.priority && j.priority !== f.priority) return false;
    if (f.category && (j.category||'') !== f.category) return false;
    if (f.deadline){
      const dl = deadlineInfo(j, t), term = TERMINAL.has(j.status);
      if (f.deadline==='none'){ if (dl) return false; }
      else if (!dl || term) return false;
      else if (f.deadline==='attention'){ if (dl.bucket==='ontrack') return false; }
      else if (dl.bucket !== f.deadline) return false;
    }
    if (q){
      const hay = [j.company, j.title, j.category, j.contactPerson, j.contactInfo, j.notes, j.status, j.priority+' priority'].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  return sortJobs(list, f.sort, f.dir);
}
function sortJobs(list, key, dir){
  const m = dir==='asc' ? 1 : -1;
  const get = { company:j => j.company.toLowerCase(), title:j => j.title.toLowerCase(), status:j => STATUSES.indexOf(j.status), priority:j => PRIORITY_RANK[j.priority] || PRIORITY_RANK[DEFAULT_PRIORITY], salary:j => salaryValue(j), applicationDate:j => j.applicationDate || null, deadline:j => j.deadline || null, updated:j => j.updatedAt }[key] || (j => j.updatedAt);
  const tie = (a,b) => a.company.localeCompare(b.company);
  return list.slice().sort((a,b) => {
    const va = get(a), vb = get(b);
    const ea = va==null || va==='', eb = vb==null || vb==='';
    if (ea || eb) return ea && eb ? tie(a,b) : (ea ? 1 : -1);   // empty values always last
    if (key==='salary'){
      if (a.currency!==b.currency) return a.currency.localeCompare(b.currency);
      if (a.salaryPeriod!==b.salaryPeriod) return a.salaryPeriod.localeCompare(b.salaryPeriod);
    }
    if (typeof va==='number') return (va-vb)*m || tie(a,b);
    return String(va).localeCompare(String(vb))*m || tie(a,b);
  });
}

    const ok = await confirmDialog({ title:'Reopen a closed application?', message:`<p><b>${esc(j.company)}</b> — ${esc(j.title)} is marked <b>${esc(j.status)}</b>, which is a final status.</p><p>Move it to <b>${esc(next)}</b>?</p>`, confirmText:'Move to '+next });
    if (!ok){ renderAll(); return; }
  }
  const from = j.status;
  setStatus(j, next, 'user');
  commit(`${j.company}: ${from} → ${next}`);
  if (next==='Applied'){
    if (!D.valid(j.applicationDate)) toast('This job has no application date, so the 14-day No Response rule will skip it until you add one.', 'warn', {duration:6000});
    else if (from!=='Applied') toast(`The 14-day No Response clock restarted today (${D.fmt(D.today())}).`, 'info');
  }
}
async function deleteJobFlow(id){

function normalizeUrl(v){
  if (!v) return { ok:true, v:'' };
  let s = v.trim();
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://'+s;
  try {
    const u = new URL(s);
    if (!['http:','https:'].includes(u.protocol) || !u.hostname.includes('.') || /\s/.test(v)) return { ok:false };
    return { ok:true, v:u.href };
  } catch(e){ return { ok:false }; }
}
function validContact(v){
  if (v.includes('@')) return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  return /^\+?[\d\s().\-]{7,20}$/.test(v) && (v.match(/\d/g) || []).length >= 7;
}

function updateAppDateWarn(form, job){
  const status = form.elements.status.value, d = form.elements.applicationDate.value, t = D.today();
  let msg = '';
  if (status==='Applied'){
    if (!d) msg = 'Add an application date so the 14-day No Response rule can run.';
    else if (D.valid(d)){
      let clock = d;
      if (job && job.status==='Applied' && job.appliedClockStart && job.appliedClockStart > clock) clock = job.appliedClockStart;
      const age = D.diff(clock, t);
      const manualReturn = job && job.status!=='Applied';   // clock will restart today
      if (d > t) msg = 'This date is in the future.';
      else if (age >= AUTO_NO_RESPONSE_DAYS && !manualReturn) msg = `More than ${AUTO_NO_RESPONSE_DAYS} days ago — this job will move to No Response automatically when saved.`;
    }
  }
  $('#appDateWarn').textContent = msg;
}
function validateJobForm(form){
  const E = form.elements, errors = {}, g = n => (E[n].value || '').trim();
  const data = { company:g('company'), title:g('title'), status:E.status.value, priority: PRIORITIES.includes(E.priority.value) ? E.priority.value : DEFAULT_PRIORITY, category:g('category'), currency:E.currency.value, salaryPeriod:E.salaryPeriod.value,
    applicationDate:g('applicationDate'), deadline:g('deadline'), contactPerson:g('contactPerson'), contactInfo:g('contactInfo'), notes:E.notes.value.trim(),
    jobDescription:E.jobDescription.value.replace(/\s+$/,'').replace(/^\s*\n/,''),
    cvFile: E.cvFile ? cleanCvPath(E.cvFile.value) : '' };
  if (!data.company) errors.company = 'Company name is required.';
  if (!data.title) errors.title = 'Job title is required.';
  if (!STATUSES.includes(data.status)) errors.status = 'Choose a valid status.';
  if (!CURRENCIES.includes(data.currency)) data.currency = 'VND';
  const num = n => { const el = E[n]; if (el.validity && el.validity.badInput) return NaN; const s = el.value.trim(); return s ? Number(s) : null; };
  const mn = num('salaryMin'), mx = num('salaryMax');
  const bad = x => x!=null && (!isFinite(x) || x<0);
  if (bad(mn) || bad(mx)) errors.salary = 'Salary must be a positive number.';
  else if (mn!=null && mx!=null && mn>mx) errors.salary = 'The minimum cannot be higher than the maximum.';
  data.salaryMin = errors.salary ? null : mn;
  data.salaryMax = errors.salary ? null : mx;
  ['applicationDate','deadline'].forEach(k => { if ((E[k].validity && E[k].validity.badInput) || (data[k] && !D.valid(data[k]))) errors[k] = 'Enter a complete, valid date.'; });
  if (data.contactInfo && !validContact(data.contactInfo)) errors.contactInfo = 'Enter a valid email address or phone number.';
  ['cvUrl'].forEach(k => { const r = normalizeUrl(g(k)); if (!r.ok) errors[k] = 'Enter a valid web address, e.g. https://company.com/job'; else data[k] = r.v; });
  return { errors, data };
}
async function submitJobForm(form, id){
  const { errors, data } = validateJobForm(form);
  showFormErrors(form, errors);

  if (id && !job){ toast('This job was deleted in the meantime.', 'error'); await Modal.close(true); return; }

    const ok = await confirmDialog({ title:'Reopen a closed application?', message:`<p><b>${esc(job.company)}</b> is marked <b>${esc(job.status)}</b>, a final status.</p><p>Change it to <b>${esc(data.status)}</b>?</p>`, confirmText:'Change status' });
    if (!ok) return;
  }
  let msg, saved;
  if (job){
    const backToApplied = job.status!=='Applied' && data.status==='Applied';
    const changed = updateJob(job, data);
    saved = job;
    msg = changed ? 'Saved changes to '+job.company : 'No changes to save';

  } else {
    saved = createJob(data);
    msg = `Added ${saved.company} (${saved.status})`;
  }
  await Modal.close(true);
  commit(msg);
  if (saved.status==='Applied' && !D.valid(saved.applicationDate)) toast('No application date: the 14-day No Response rule will skip this job until you add one.', 'warn', {duration:6500});
}

const noteKey = n => n.interviewDate || D.localDateOf(n.createdAt) || '';
function filteredNotes(){
  const f = App.nf, q = f.q.trim().toLowerCase();
  const list = S().notes.filter(n => {
    if (f.company && n.company.toLowerCase()!==f.company.toLowerCase()) return false;
    if (f.round && n.round!==f.round) return false;
    if (f.from && (!n.interviewDate || n.interviewDate < f.from)) return false;
    if (f.to && (!n.interviewDate || n.interviewDate > f.to)) return false;

      if (!hay.includes(q)) return false;
    }

function handleImportFile(file){
  if (!file) return;
  if (file.size > 15*1024*1024){ toast('That file is too large to be an Adrian Jobtrack backup.', 'error'); return; }
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read the file.', 'error');
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(reader.result).replace(/^﻿/, '')); }
    catch(e){ showImportPreview({ fatal:true, errors:['The file is not valid JSON.'] }, file.name); return; }
    showImportPreview(validateData(parsed), file.name);
  };
  reader.readAsText(file);
}

/* =========================================================
   14b. CV FOLDER (File System Access API — Chrome / Edge)
   Jobs store a path inside the CV folder (e.g. "Resume.pdf"). Links are
   relative ("CV/Resume.pdf"), so they work as long as this HTML file and
   the CV folder stay side by side. Folder access is only needed to list
   files and copy new CVs in; opening a CV never needs it.
   ========================================================= */
const KV = {   // tiny IndexedDB key-value store (folder handles cannot go in localStorage)
  _db: null,
  open(){
    if (!this._db){
      this._db = new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
        const r = indexedDB.open('adrianJobtrack', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
      this._db.catch(() => { this._db = null; });
    }
    return this._db;
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => { const tx = db.transaction('kv', mode); const r = fn(tx.objectStore('kv')); tx.oncomplete = () => res(r && r.result); tx.onerror = tx.onabort = () => rej(tx.error); });
  },
  get(k){ return this.run('readonly', s => s.get(k)); },
  set(k, v){ return this.run('readwrite', s => s.put(v, k)); },
  del(k){ return this.run('readwrite', s => s.delete(k)); }
};
const CVFolder = {
  supported: typeof window.showDirectoryPicker==='function',
  handle: null,
  state: 'none',     // unsupported | none | prompt | granted | error
  files: [],         // [{path, name, size, modified}], newest first (only while granted)
  error: '',
  lastRefresh: 0,
  has(path){ const p = cleanCvPath(path).toLowerCase(); return this.files.some(f => f.path.toLowerCase()===p); },
  async init(){
    if (!this.supported){ this.state = 'unsupported'; return; }
    try { this.handle = (await KV.get('cvFolder')) || null; } catch(e){ this.handle = null; }
    if (!this.handle){ this.state = 'none'; return; }
    try { this.state = (await this.handle.queryPermission({mode:'readwrite'}))==='granted' ? 'granted' : 'prompt'; }
    catch(e){ this.state = 'prompt'; }
    if (this.state==='granted') await this.refresh(true);
  },
  /** Ask the user to pick the CV folder (or its parent "7. Job Tracking" folder). */
  async connect(){
    let h;
    try { h = await window.showDirectoryPicker({ id:'adrian-cv', mode:'readwrite' }); }
    catch(e){ if (e && e.name==='AbortError') return false; throw e; }
    if (h.name.toLowerCase()!==CV_DIR.toLowerCase()){
      let child = null;
      try { child = await h.getDirectoryHandle(CV_DIR); } catch(e){}
      if (!child) throw new Error(`Please choose the folder named "${CV_DIR}" that sits next to Adrian Jobtrack.html (you chose "${h.name}").`);
      h = child;
    }
    this.handle = h;
    try { await KV.set('cvFolder', h); } catch(e){ /* not remembered, but works for this session */ }
    this.state = 'granted';
    await this.refresh(true);
    return true;
  },
  async reconnect(){
    if (!this.handle) return this.connect();
    let p = 'denied';
    try { p = await this.handle.requestPermission({mode:'readwrite'}); } catch(e){}
    this.state = p==='granted' ? 'granted' : 'prompt';
    if (this.state==='granted') await this.refresh(true);
    return this.state==='granted';
  },
  async disconnect(){
    this.handle = null; this.files = []; this.state = this.supported ? 'none' : 'unsupported';
    try { await KV.del('cvFolder'); } catch(e){}
  },
  /** Re-read the folder. Returns true if the file list changed. */
  async refresh(force){
    if (this.state!=='granted' || !this.handle) return false;
    if (!force && Date.now()-this.lastRefresh < 4000) return false;
    this.lastRefresh = Date.now();
    const out = [];
    const walk = async (dir, prefix, depth) => {
      for await (const h of dir.values()){
        if (h.kind==='file'){
          if (!/\.pdf$/i.test(h.name) || h.name.startsWith('~$')) continue;
          let size = null, modified = null;
          try { const f = await h.getFile(); size = f.size; modified = f.lastModified; } catch(e){}
          out.push({ path: prefix+h.name, name: h.name, size, modified });
        } else if (h.kind==='directory' && depth < 3 && !h.name.startsWith('.')){
          await walk(h, prefix+h.name+'/', depth+1);
        }
      }
    };
    try { await walk(this.handle, '', 0); }
    catch(e){
      if (e && e.name==='NotAllowedError') this.state = 'prompt';
      else { this.state = 'error'; this.error = 'The CV folder could not be read — it may have been moved, renamed or deleted.'; }
      this.files = [];
      return true;
    }
    out.sort((a,b) => (b.modified||0)-(a.modified||0) || a.path.localeCompare(b.path));
    const changed = JSON.stringify(out)!==JSON.stringify(this.files);
    this.files = out;
    return changed;
  },
  /** Copy a PDF into the CV folder. Returns its path inside the folder. */
  async addFile(file){
    if (this.state!=='granted' || !this.handle) throw new Error('Connect the CV folder first.');
    let name = file.name.replace(/[\\/:*?"<>|]/g, '_').trim();
    if (!/\.pdf$/i.test(name)) throw new Error('Only PDF files can be added to the CV folder.');
    let existing = null;
    try { existing = await (await this.handle.getFileHandle(name)).getFile(); } catch(e){}
    if (existing){
      if (existing.size===file.size && existing.lastModified===file.lastModified){ await this.refresh(true); return name; }   // it is already in the folder
      const replace = await confirmDialog({ title:'A CV with this name already exists', message:`<p><b>${esc(name)}</b> is already in the CV folder.</p><p>Replace it with the file you chose, or keep both? Keeping both adds a number to the new file's name.</p>`, confirmText:'Replace file', cancelText:'Keep both' });
      if (!replace){
        const base = name.replace(/\.pdf$/i, '');
        for (let i = 2; ; i++){ const cand = `${base} (${i}).pdf`; try { await this.handle.getFileHandle(cand); } catch(e){ name = cand; break; } }
      }
    }
    const fh = await this.handle.getFileHandle(name, {create:true});
    const w = await fh.createWritable();
    try { await w.write(file); await w.close(); }
    catch(e){ try { await w.abort(); } catch(_){} throw e; }
    await this.refresh(true);
    return name;
  }
};

  if (window.showOpenFilePicker){

function cvUsage(){
  const m = {};
  S().jobs.forEach(j => { if (j.cvFile){ const k = j.cvFile.toLowerCase(); (m[k] = m[k] || []).push(j); } });
  return m;
}
const cvMissing = path => !!path && CVFolder.state==='granted' && !CVFolder.has(path);
const fmtSize = b => b==null ? '' : b < 1024*1024 ? Math.max(1, Math.round(b/1024))+' KB' : (b/1024/1024).toFixed(1)+' MB';
const fmtFileDate = ms => ms ? D.fmtDT(new Date(ms).toISOString()).slice(0,10) : '';
function cvStatusHTML(noButtons){
  const s = CVFolder.state, b = (action, label) => noButtons ? '' : ` <button type="button" class="link-btn" data-action="${action}">${label}</button>`;
  if (s==='unsupported') return `${ICON('folder',13)} This browser cannot read folders — open the app in Chrome or Edge to list your CV folder.${b('cv-choose-name','Choose a file name…')}`;
  if (s==='none') return `${ICON('folder',13)} Connect your <b>${CV_DIR}</b> folder once to list its PDFs.${b('cv-connect','Connect CV folder')}`;
  if (s==='prompt') return `${ICON('folder',13)} Allow access to the CV folder again to see its latest files.${b('cv-reconnect','Allow access')}`;
  if (s==='error') return `<span style="color:var(--danger)">${esc(CVFolder.error)}</span>${b('cv-connect','Connect again')}`;
  return `${ICON('folder',13)} Connected · ${plural(CVFolder.files.length,'PDF')} in the CV folder, newest first.${b('cv-refresh','Refresh')}`;
}
function cvPickerInner(current){
  current = cleanCvPath(current);
  const cur = current.toLowerCase(), usage = cvUsage();
  let opts;
  if (CVFolder.state==='granted'){
    opts = CVFolder.files.map(f => { const n = (usage[f.path.toLowerCase()] || []).length; return { v:f.path, label: f.path+(f.modified ? '  ·  '+fmtFileDate(f.modified) : '')+(n ? '  ·  used by '+plural(n,'job') : '') }; });
  } else {
    opts = Array.from(new Set(S().jobs.map(j => j.cvFile).filter(Boolean))).sort().map(p => ({ v:p, label:p }));
  }
  if (current && !opts.some(o => o.v.toLowerCase()===cur)) opts.unshift({ v:current, label: current+(CVFolder.state==='granted' ? '  —  not found in CV folder' : '') });
  const sel = `<select class="input" id="f_cvFile" name="cvFile"><option value="">— No CV file —</option>${opts.map(o => `<option value="${esc(o.v)}"${o.v.toLowerCase()===cur ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  const open = `<a class="btn" id="cvOpenBtn" href="${current ? esc(cvHref(current)) : '#'}" target="_blank" rel="noopener"${current ? '' : ' hidden'} title="Open this CV in a new tab">${ICON('file',14)} Open</a>`;
  const add = CVFolder.state==='granted' ? `<button type="button" class="btn" data-action="cv-add" title="Copy a PDF into the CV folder and select it">+ Add new CV…</button>` : '';
  const warn = cvMissing(current) ? `<div class="warnmsg">This file is not in the CV folder any more (renamed, moved or deleted). Choose another file.</div>` : '';
  return `<div class="cv-pick">${sel}${open}${add}</div>${warn}<div class="cv-status">${cvStatusHTML()}</div>`;
}
function syncCvOpenBtn(){
  const s = $('#f_cvFile'), b = $('#cvOpenBtn'); if (!s || !b) return;
  b.hidden = !s.value; b.href = s.value ? cvHref(s.value) : '#';
}
function renderCvPicker(value){
  const box = $('#cvPicker'); if (!box) return;
  const cur = value!=null ? value : ($('#f_cvFile') ? $('#f_cvFile').value : '');
  box.innerHTML = cvPickerInner(cur);
}
function cvManagerHTML(){
  const s = CVFolder.state, usage = cvUsage();
  const usedBy = list => list && list.length ? 'Used by '+list.slice(0,4).map(j => esc(j.company)).join(', ')+(list.length>4 ? ` +${list.length-4} more` : '') : '<span class="muted">Not linked to any job</span>';
  const row = (path, meta, list, missing) => `<div class="cv-row"><span class="cv-ico">${ICON('file',16)}</span><div class="li-main"><div class="li-title" title="${esc(path)}">${esc(path)}${missing ? ' <span class="tag tag-overdue">Not found in folder</span>' : ''}</div><div class="li-sub">${meta ? meta+' · ' : ''}${usedBy(list)}</div></div>${missing ? '' : `<a class="btn btn-sm" href="${esc(cvHref(path))}" target="_blank" rel="noopener">Open</a>`}</div>`;
  const buttons = s==='granted'
    ? `<button type="button" class="btn btn-primary" data-action="cv-add">+ Add new CV…</button><button type="button" class="btn" data-action="cv-refresh">${ICON('refresh',14)} Refresh</button><button type="button" class="btn btn-ghost" data-action="cv-disconnect">Disconnect</button>`
    : s==='prompt' ? `<button type="button" class="btn btn-primary" data-action="cv-reconnect">Allow access</button><button type="button" class="btn btn-ghost" data-action="cv-disconnect">Disconnect</button>`
    : s==='unsupported' ? '' : `<button type="button" class="btn btn-primary" data-action="cv-connect">${ICON('folder',14)} Connect CV folder</button>`;
  let list = '';
  if (s==='granted'){
    const known = new Set(CVFolder.files.map(f => f.path.toLowerCase()));
    const missing = Object.keys(usage).filter(k => !known.has(k)).map(k => usage[k]);
    list = `<h3 style="margin:16px 0 6px">Files in the CV folder (${CVFolder.files.length})</h3>`
      + (CVFolder.files.length ? CVFolder.files.map(f => row(f.path, [fmtFileDate(f.modified), fmtSize(f.size)].filter(Boolean).join(' · '), usage[f.path.toLowerCase()], false)).join('') : emptySm('No PDF files in the CV folder yet. Use “Add new CV…” or save a PDF into the folder, then press Refresh.'))
      + (missing.length ? `<h3 style="margin:16px 0 6px;color:var(--danger)">Linked files not found (${missing.length})</h3>` + missing.map(l => row(l[0].cvFile, '', l, true)).join('') + '<p class="footnote">These jobs point to a CV that is no longer in the folder. Open each job and choose another file.</p>' : '');
  } else {
    const keys = Object.keys(usage);
    list = `<h3 style="margin:16px 0 6px">CV files linked to jobs (${keys.length})</h3>` + (keys.length ? keys.map(k => row(usage[k][0].cvFile, '', usage[k], false)).join('') : emptySm('No job is linked to a CV file yet.'));
  }
  return `<p class="small">Keep your CVs as PDFs in the <b>${CV_DIR}</b> folder next to <b>Adrian Jobtrack.html</b>. Jobs link to these files, so links keep working as long as the HTML file and the ${CV_DIR} folder stay together.</p>
    <div class="cv-status" style="margin:10px 0">${cvStatusHTML(true)}</div>
    ${buttons ? `<div class="cv-actions">${buttons}</div>` : ''}
    <div id="cvManagerList">${list}</div>
    <p class="footnote">Connecting only lets this page list your CV folder and copy new CVs into it. Your browser may ask for permission again after you reopen the app. Opening a CV never needs permission.</p>`;
}
function openCvFolderModal(){
  Modal.open({ title:'CV folder', size:'lg', body:`<div id="cvManager">${cvManagerHTML()}</div>`, footer:`<span class="spacer"></span><button type="button" class="btn" data-action="modal-close">Close</button>` });
}
function updateCvUI(){
  renderCvPicker();
  syncCvOpenBtn();
  const m = $('#cvManager'); if (m) m.innerHTML = cvManagerHTML();
}
async function cvRun(fn, okMsg){
  try { const r = await fn(); if (r!==false && okMsg) toast(typeof okMsg==='function' ? okMsg(r) : okMsg); }
  catch(e){ toast((e && e.message) || 'Something went wrong with the CV folder.', 'error', { duration:8000 }); }
  updateCvUI();
}
async function cvAddFlow(){
  let file;
  try { file = await pickPdf(); } catch(e){ toast((e && e.message) || 'Could not open the file picker.', 'error'); return; }
  if (!file) return;
  await cvRun(async () => {
    const path = await CVFolder.addFile(file);
    const s = $('#f_cvFile');
    if (s){ renderCvPicker(path); syncCvOpenBtn(); Modal.dirty = true; }
    return path;
  }, path => `${cvName(path)} is in the CV folder${$('#f_cvFile') ? ' and selected for this job' : ''}.`);
}

/* =========================================================
   15. EVENTS
   ========================================================= */
function closeMenu(){ $('#dataMenu').hidden = true; $('#dataMenuBtn').setAttribute('aria-expanded','false'); }
const Actions = {
  'noop': () => {},
  'add-job': el => swapModal(() => openJobModal(null, el.dataset.status)),
  'open-job': el => swapModal(() => openJobModal(el.dataset.id)),
  'edit-job': el => swapModal(() => openJobModal(el.dataset.id)),
  'delete-job': el => deleteJobFlow(el.dataset.id),
  'add-note': el => swapModal(() => { if (App.tab!=='notes' && !el.dataset.jobId) switchTab('notes'); openNoteModal(null, el.dataset.jobId); }),
  'open-note': el => swapModal(() => openNoteModal(el.dataset.id)),
  'delete-note': el => deleteNoteFlow(el.dataset.id),
  'modal-close': () => Modal.close(),
  'q-add': () => { const l = $('#qList'); if (!l) return; l.insertAdjacentHTML('beforeend', qRow(newQ())); Modal.dirty = true; $('.q-text', l.lastElementChild).focus(); },
  'q-remove': el => { const r = el.closest('.q-row'); if (r){ r.remove(); Modal.dirty = true; } },
  'tracker-view': el => { S().settings.trackerView = el.dataset.view; Store.save(); renderTracker(); },
  'notes-view': el => { S().settings.notesView = el.dataset.view; Store.save(); renderNotes(); },
  'toggle-status-filter': el => { const s = el.dataset.status, f = App.filters.statuses; if (f.has(s)) f.delete(s); else f.add(s); renderTracker(); },
  'clear-filters': () => { const keep = { sort:App.filters.sort, dir:App.filters.dir }; resetFilters(); Object.assign(App.filters, keep); renderTracker(); },
  'sort-dir': () => { App.filters.dir = App.filters.dir==='asc' ? 'desc' : 'asc'; renderTracker(); },
  'sort': el => { const k = el.dataset.key, f = App.filters; if (f.sort===k) f.dir = f.dir==='asc' ? 'desc' : 'asc'; else { f.sort = k; f.dir = DESC_FIRST.has(k) ? 'desc' : 'asc'; } renderTracker(); },
  'goto-priority': el => { resetFilters(); App.filters.priority = el.dataset.priority; if (el.dataset.open) STATUSES.filter(s => !TERMINAL.has(s)).forEach(s => App.filters.statuses.add(s)); switchTab('tracker'); },
  'goto-status': el => { resetFilters(); App.filters.statuses.add(el.dataset.status); switchTab('tracker'); },
  'goto-all': () => { resetFilters(); switchTab('tracker'); },
  'goto-deadlines': () => { resetFilters(); Object.assign(App.filters, { deadline:'attention', sort:'deadline', dir:'asc' }); switchTab('tracker'); },
  'heat-day': el => { App.heatDay = App.heatDay===el.dataset.date ? null : el.dataset.date; renderDashboard(); },
  'toggle-insights': () => { App.showAllInsights = !App.showAllInsights; renderDashboard(); },
  'toggle-note-insights': () => { App.showNoteInsights = !App.showNoteInsights; renderNotes(); },
  'clear-note-filters': () => { const sort = App.nf.sort; resetNoteFilters(); App.nf.sort = sort; renderNotes(); },
  'cv-manage': () => { closeMenu(); swapModal(openCvFolderModal); },
  'cv-connect': () => cvRun(() => CVFolder.connect(), () => `CV folder connected — ${plural(CVFolder.files.length,'PDF')} found.`),
  'cv-reconnect': () => cvRun(() => CVFolder.reconnect(), ok => ok ? `Access allowed — ${plural(CVFolder.files.length,'PDF')} in the CV folder.` : ''),
  'cv-refresh': () => cvRun(() => CVFolder.refresh(true).then(() => true), () => `${plural(CVFolder.files.length,'PDF')} in the CV folder.`),
  'cv-disconnect': () => cvRun(() => CVFolder.disconnect().then(() => true), 'CV folder disconnected. Existing CV links still work.'),
  'cv-add': () => cvAddFlow(),
  'cv-choose-name': () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.pdf,application/pdf';
    i.onchange = () => { const f = i.files[0]; if (!f) return; renderCvPicker(f.name); syncCvOpenBtn(); Modal.dirty = true; toast(`Linked to ${CV_DIR}/${f.name}. Make sure this file is saved in the ${CV_DIR} folder.`, 'info', { duration:7000 }); };
    i.click();
  },
  'cloud-sync': () => { closeMenu(); if (window.CloudSync && CloudSync.opts) CloudSync.open(); else toast('Cloud sync is not available here. Open the app from its web link, or check your internet connection.', 'warn'); },
  'export': () => { closeMenu(); exportData(); },
  'import': () => { closeMenu(); const i = $('#importFile'); i.value = ''; i.click(); },
  'reset-sample': () => { closeMenu(); resetSampleFlow(); },
  'clear-all': () => { closeMenu(); clearAllFlow(); }
};
function bindEvents(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.closest('#confirmRoot')) return;
    const fn = Actions[el.dataset.action];
    if (fn) fn(el, e);
  });
  document.addEventListener('change', e => {
    if (e.target.id==='f_cvFile'){ syncCvOpenBtn(); return; }
    const el = e.target.closest('[data-change]');
    if (el && el.dataset.change==='status') requestStatusChange(el.dataset.id, el.value);
  });
  document.addEventListener('keydown', e => {
    if (e.key==='Escape'){
      if (!$('#dataMenu').hidden){ closeMenu(); $('#dataMenuBtn').focus(); return; }
      if (Modal.isOpen()){ Modal.close(); return; }
    }
    if ((e.key==='Enter' || e.key===' ') && e.target.matches && e.target.matches('[role="button"][data-action], .job-card[data-action], .note-card[data-action]')){
      e.preventDefault(); e.target.click();
    }
  });
  // tabs
  $$('.tab').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
  // data menu
  $('#dataMenuBtn').addEventListener('click', e => { e.stopPropagation(); const m = $('#dataMenu'); m.hidden = !m.hidden; $('#dataMenuBtn').setAttribute('aria-expanded', String(!m.hidden)); });
  document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeMenu(); });
  $('#importFile').addEventListener('change', e => handleImportFile(e.target.files[0]));
  // theme
  $('#themeToggle').addEventListener('click', () => { S().settings.theme = effectiveTheme()==='dark' ? 'light' : 'dark'; applyTheme(); Store.save(); });
  if (darkMQ){ const h = () => { if (S().settings.theme==='system') applyTheme(); }; if (darkMQ.addEventListener) darkMQ.addEventListener('change', h); else if (darkMQ.addListener) darkMQ.addListener(h); }
  // tracker toolbar
  $('#jobSearch').addEventListener('input', e => { App.filters.q = e.target.value; renderTracker(); });
  $('#catFilter').addEventListener('change', e => { App.filters.category = e.target.value; renderTracker(); });
  $('#deadlineFilter').addEventListener('change', e => { App.filters.deadline = e.target.value; renderTracker(); });
  $('#sortSelect').addEventListener('change', e => { App.filters.sort = e.target.value; App.filters.dir = DESC_FIRST.has(e.target.value) ? 'desc' : 'asc'; renderTracker(); });
  $('#prioFilter').addEventListener('change', e => { App.filters.priority = e.target.value; renderTracker(); });
  // notes toolbar
  $('#noteSearch').addEventListener('input', e => { App.nf.q = e.target.value; renderNotes(); });
  $('#noteCompany').addEventListener('change', e => { App.nf.company = e.target.value; renderNotes(); });
  $('#noteRound').addEventListener('change', e => { App.nf.round = e.target.value; renderNotes(); });
  $('#noteFrom').addEventListener('change', e => { App.nf.from = D.valid(e.target.value) ? e.target.value : ''; renderNotes(); });
  $('#noteTo').addEventListener('change', e => { App.nf.to = D.valid(e.target.value) ? e.target.value : ''; renderNotes(); });
  $('#noteSort').addEventListener('change', e => { App.nf.sort = e.target.value; renderNotes(); });
  // modal backdrop
  const mr = $('#modalRoot');
  mr.addEventListener('mousedown', e => { Modal.downOnBackdrop = e.target===mr; });
  mr.addEventListener('click', e => { if (e.target===mr && Modal.downOnBackdrop) Modal.close(); });
  // drag and drop (Kanban)
  const tb = $('#trackerBody');
  tb.addEventListener('dragstart', e => {
    const c = e.target.closest && e.target.closest('.job-card'); if (!c) return;
    App.dragId = c.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', c.dataset.id); } catch(err){}
    requestAnimationFrame(() => c.classList.add('dragging'));
  });
  tb.addEventListener('dragend', () => { App.dragId = null; $$('.dragging, .drag-over', tb).forEach(x => x.classList.remove('dragging','drag-over')); });
  tb.addEventListener('dragover', e => {
    const col = e.target.closest && e.target.closest('.col'); if (!col || !App.dragId) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    $$('.col.drag-over', tb).forEach(x => { if (x!==col) x.classList.remove('drag-over'); });
    col.classList.add('drag-over');
  });
  tb.addEventListener('dragleave', e => { const col = e.target.closest && e.target.closest('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over'); });
  tb.addEventListener('drop', e => {
    const col = e.target.closest && e.target.closest('.col'); if (!col) return;
    e.preventDefault();
    const id = App.dragId || e.dataTransfer.getData('text/plain');
    col.classList.remove('drag-over'); App.dragId = null;
    if (id) requestStatusChange(id, col.dataset.status);
  });
  // periodic + resume checks for the 14-day rule
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  window.addEventListener('focus', tick);
  // a new CV may have been saved into the folder while the app was in the background
  const cvRecheck = () => { if (CVFolder.state==='granted') CVFolder.refresh(false).then(ch => { if (ch) updateCvUI(); }).catch(() => {}); };
  window.addEventListener('focus', cvRecheck);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cvRecheck(); });
  // other tabs / windows editing the same data
  window.addEventListener('storage', e => {
    if (e.key!==STORAGE_KEY || e.newValue==null) return;
    try {
      const res = validateData(JSON.parse(e.newValue));
      if (res.fatal) return;
      Store.state = res.state; applyTheme(); renderAll(); setSaveStatus('saved');
      toast('Data was updated in another tab — view refreshed.', 'info');
    } catch(err){}
  });
}
function tick(){
  if (!S()) return;
  const { moved } = runAutoStatus();
  if (moved.length){ Store.save(); renderAll(); notifyMoved(moved); }
  else if (App.lastDay !== D.today()) renderAll();   // new day: refresh deadline badges
}

/* =========================================================
   15b. CLOUD SYNC (Firebase — phone ↔ computer)
   Each job and each interview note is its own cloud document, so two
   devices editing different jobs never overwrite each other. The activity
   log is stored per month. Theme and view choices stay per device.
   ========================================================= */
const FIREBASE_CONFIG = {   // public web config (not a secret — Firestore rules protect the data)
  apiKey: 'AIzaSyAZryMRbozkS-owOagwJeHqRubGABb66NA',
  authDomain: 'adrian-job-track.firebaseapp.com',
  projectId: 'adrian-job-track',
  storageBucket: 'adrian-job-track.firebasestorage.app',
  messagingSenderId: '742908379990',
  appId: '1:742908379990:web:4916324b8332590f4d8cf7'
};
function splitState(s){
  const out = { version: s.version, settings: s.settings, jobOrder: s.jobs.map(j => j.id), noteOrder: s.notes.map(n => n.id) };
  s.jobs.forEach(j => { out['job_'+j.id] = j; });
  s.notes.forEach(n => { out['note_'+n.id] = n; });
  s.activity.forEach(a => { const k = 'act_'+String(a.at).slice(0,7); (out[k] = out[k] || []).push(a); });
  if (s.meta !== undefined) out.meta = s.meta;
  return out;
}
function joinState(p){
  const pick = (prefix, order) => {
    const seen = new Set(), list = [];
    (order || []).forEach(id => { const v = p[prefix+id]; if (v && !seen.has(id)){ seen.add(id); list.push(v); } });
    Object.keys(p).filter(k => k.startsWith(prefix) && !seen.has(k.slice(prefix.length))).sort().forEach(k => list.push(p[k]));
    return list;
  };
  const activity = [];
  Object.keys(p).filter(k => k.startsWith('act_')).sort().forEach(k => { if (Array.isArray(p[k])) activity.push(...p[k]); });
  const out = { version: p.version != null ? p.version : SCHEMA_VERSION, jobs: pick('job_', p.jobOrder), notes: pick('note_', p.noteOrder), activity, settings: p.settings || defaultSettings() };
  if (p.meta !== undefined) out.meta = p.meta;
  return out;
}
function initCloudSync(){
  if (!window.CloudSync || !Store.available) return;
  try {
    CloudSync.init({
      firebaseConfig: FIREBASE_CONFIG,
      appName: 'Adrian Jobtrack',
      getState: () => S(),
      setState: s => {
        const res = validateData(s);
        if (res.fatal) return;
        if (!res.state.meta || !res.state.meta.createdAt) res.state.meta = S().meta;
        Store.state = res.state;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.state)); } catch(e){}
        applyTheme(); setSaveStatus('saved');
      },
      render: () => { renderAll(); updateCvUI(); },
      isBusy: () => Modal.isOpen() || !$('#confirmRoot').hidden,
      localOnly: ['settings.theme', 'settings.trackerView', 'settings.notesView', 'meta'],
      describe: s => `${plural((s.jobs||[]).length,'job')}, ${plural((s.notes||[]).length,'interview note')}`,
      split: splitState,
      join: joinState,
      mount: '#syncSlot'
    });
  } catch(e){ console.warn('Cloud sync could not start', e); }
}
const syncNote = () => (window.CloudSync && CloudSync.opts && CloudSync.note()) ? `<p>${esc(CloudSync.note().trim())}</p>` : '';

/* =========================================================
   16. INIT
   ========================================================= */
function init(){
  Modal.root = $('#modalRoot');
  const result = Store.init();
  applyTheme();
  bindEvents();
  const { moved, missing } = runAutoStatus();   // catch up after days without opening the app
  if (moved.length) Store.save();
  renderAll();
  if (result==='seeded') toast('Sample data loaded so you can explore. Use Data → Clear all data when you are ready to start fresh.', 'info', { duration:8000 });
  if (moved.length) notifyMoved(moved);
  CVFolder.init().then(updateCvUI).catch(() => {});
  initCloudSync();
  if (missing.length) toast(`${plural(missing.length,'Applied job')} ${missing.length===1 ? 'has' : 'have'} no valid application date, so the 14-day rule skipped ${missing.length===1 ? 'it' : 'them'}. Please add the date.`, 'warn', { duration:8000, action:{ label:'Fix', fn:() => openJobModal(missing[0].id) } });
}
// debug/test hook (read-only helpers)
window.AdrianJobtrack = { get state(){ return S(); }, runAutoStatus: () => { const r = runAutoStatus(); if (r.moved.length){ Store.save(); renderAll(); notifyMoved(r.moved); } return r.moved.length; } };
init();
})();
